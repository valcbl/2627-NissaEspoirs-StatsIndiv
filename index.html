<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Stats indiv Nissa Rugby</title>
<style>
/* Layout: même gabarit que l'analyse défensive Crabos — bandeau, 4 secteurs (KPI, barres par joueur + cartes latérales, déroulé, tableau) */
:root{
  --bg:#f2f3ef; --card:#ffffff; --ink:#15171a; --muted:#6b6f73; --line:#e3e5e0; --track:#ecede9;
  --b1:#1d5cb0; --b2:#3b87e0; --b3:#a6c8f2; --red:#e2474b; --orange:#e8710a;
  --good:#1e7a43; --card-yellow:#f2c200; --card-red:#d7262b; --card-white:#ffffff; --bad:#c9353a;
  --chip-good-bg:#e3f1e7; --chip-warn-bg:#f8eed3; --chip-bad-bg:#f8e1e1; --chip-warn:#a8740a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121416;--card:#1b1e21;--ink:#eceef0;--muted:#9aa0a6;--line:#2c3035;--track:#262a2e;--b1:#5b93e6;--b2:#3f7fd4;--b3:#2c4f7c;--red:#ef6467;--orange:#f08a3c;--card-yellow:#f5cd2e;--card-red:#ef4a4e;--card-white:#ffffff;--good:#5fc287;--bad:#f07a7d;--chip-good-bg:#1d3326;--chip-warn-bg:#3a2f12;--chip-bad-bg:#3d1f21;--chip-warn:#e5b546;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121416;--card:#1b1e21;--ink:#eceef0;--muted:#9aa0a6;--line:#2c3035;--track:#262a2e;--b1:#5b93e6;--b2:#3f7fd4;--b3:#2c4f7c;--red:#ef6467;--orange:#f08a3c;--card-yellow:#f5cd2e;--card-red:#ef4a4e;--card-white:#ffffff;--good:#5fc287;--bad:#f07a7d;--chip-good-bg:#1d3326;--chip-warn-bg:#3a2f12;--chip-bad-bg:#3d1f21;--chip-warn:#e5b546;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 40px;display:flex;flex-direction:column;gap:18px}
header{border-bottom:2px solid var(--ink);padding-bottom:12px;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px;flex-wrap:wrap}
nav a{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
nav a:hover,nav a:focus-visible{border-color:var(--ink);outline:none}
section.sector{display:flex;flex-direction:column;gap:14px;scroll-margin-top:56px;padding-top:8px}
.sec-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-title h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.sec-title span{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.card p.sub{margin:-4px 0 12px;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.kpi .l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:4px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{background:var(--chip-good-bg);color:var(--good)}
.chip.warn{background:var(--chip-warn-bg);color:var(--chip-warn)}
.chip.bad{background:var(--chip-bad-bg);color:var(--bad)}
.chip.info{background:var(--track);color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.prow{display:grid;grid-template-columns:118px minmax(0,1fr) 52px;align-items:center;gap:10px;height:24px}
.prow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .track{display:flex;height:16px}
.prow .track b{display:block;height:100%;border-right:1px solid var(--card)}
.prow .track b:first-child{border-radius:3px 0 0 3px}
.prow .track b:last-child{border-radius:0 3px 3px 0;border-right:0}
.prow .track b:only-child{border-radius:3px}
.prow .pc{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:12px}
.axis{display:grid;grid-template-columns:118px minmax(0,1fr) 52px;gap:10px;margin-top:6px}
.axis .ticks{position:relative;height:14px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.axis .ticks span{position:absolute;transform:translateX(-50%)}
.g{color:var(--good)} .r{color:var(--bad)}
.brk{display:flex;flex-direction:column;gap:12px}
.brk .it{display:flex;flex-direction:column;gap:5px}
.brk .top{display:flex;justify-content:space-between;gap:10px}
.brk .top em{font-style:normal;color:var(--muted);font-size:11px}
.brk .top b{font-variant-numeric:tabular-nums}
.brk .bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.brk .bar i{display:block;height:100%;border-radius:3px}
.ret{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ret li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.ret .chip{margin-top:0}
.tl{overflow-x:auto}
.tl svg{display:block;min-width:640px;width:100%;height:auto}
.tl text{fill:var(--muted);font-family:var(--font);font-size:11px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.card-head h3{margin:0}
.card-head span{color:var(--muted);font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;user-select:none}
th:hover{color:var(--ink)}
th:focus-visible{outline:2px solid var(--b2);outline-offset:-2px}
th.on{color:var(--ink)}
th.on::after{content:" ▾"} th.on.asc::after{content:" ▴"}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:500}
td.d{color:var(--muted)}
td.pct{font-weight:600}
tbody tr:hover td{background:var(--track)}
footer{color:var(--muted);font-size:11px;max-width:110ch}
@media (max-width:520px){.prow,.axis{grid-template-columns:88px minmax(0,1fr) 42px;gap:8px}.ret li{grid-template-columns:minmax(0,1fr)}}
</style>

<style>
#report{min-width:0;display:flex;flex-direction:column;gap:18px}
.bar-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar-tools .left,.bar-tools .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text]{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--b2);outline-offset:1px}
button{font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:7px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--card)}
button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
button.danger{background:var(--card);color:var(--bad);border-color:var(--line)}
button.danger.armed{background:var(--bad);color:var(--card);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.import{display:flex;flex-direction:column;gap:14px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.drop.over{border-color:var(--b2);background:var(--track)}
.drop b{color:var(--ink);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msg{font-size:12px;min-height:1em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{margin:0}
.empty p{margin:0;color:var(--muted);max-width:52ch}
@page{size:A4;margin:10mm}
@media print{
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  nav,.no-print{display:none!important}
  .wrap{max-width:none;padding-block:0}
  section.sector{break-before:page;padding-top:0}
  section.sector:first-of-type{break-before:auto}
  .card,.kpi,.prow{break-inside:avoid}
  .grid2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)!important}
  .tl svg{min-width:0}
  th.on::after{content:""}
  th,td{padding:4px 5px}
  .tw{overflow:visible}
  table{font-size:11px}
  th{font-size:9px;letter-spacing:.03em;white-space:normal}
}
</style>
<style>
/* Identité Nissa Rugby : blanc, noir, rouge écusson ; titres en slab (Bitter), hexagone de l'écusson comme repère de section */
:root{
  --bg:#f3f3f1; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b67; --line:#e1e1dd; --track:#ececE8;
  --nissa:#e30613; --nissa-dark:#b0000c;
  --b1:#1d1d1b; --b2:#5e5e5a; --b3:#bdbdb7; --red:#e30613; --orange:#e8710a;
  --good:#1e7a43; --bad:#d10a16; --chip-bad-bg:#fbe3e4;
  --card-yellow:#f2c200; --card-red:#e30613; --card-white:#ffffff;
  --display:"Bitter","Roboto Slab",Georgia,serif;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111111;--card:#1b1b1a;--ink:#f0f0ee;--muted:#a2a29e;--line:#2e2e2c;--track:#262624;--nissa:#ff3340;--nissa-dark:#ff6670;--b1:#f0f0ee;--b2:#a5a5a1;--b3:#5b5b58;--red:#ff3340;--orange:#f08a3c;--good:#5fc287;--bad:#ff5a64;--chip-bad-bg:#3d1c1f;--card-yellow:#f5cd2e;--card-red:#ff3340;--card-white:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111111;--card:#1b1b1a;--ink:#f0f0ee;--muted:#a2a29e;--line:#2e2e2c;--track:#262624;--nissa:#ff3340;--nissa-dark:#ff6670;--b1:#f0f0ee;--b2:#a5a5a1;--b3:#5b5b58;--red:#ff3340;--orange:#f08a3c;--good:#5fc287;--bad:#ff5a64;--chip-bad-bg:#3d1c1f;--card-yellow:#f5cd2e;--card-red:#ff3340;--card-white:#ffffff;color-scheme:dark}
body{font-family:var(--font)}
.mast{display:flex;flex-direction:row;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--nissa);border-radius:10px;padding:14px 20px}
.mast img{width:72px;height:auto;flex:none}
.mast .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.mast .eyebrow{color:var(--nissa)}
.mast h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(24px,4.4vw,38px)}
.mast h1 span{color:var(--nissa)}
.mast .meta{font-size:12px;color:var(--muted);font-weight:500}
.sec-title h2{font-family:var(--display);font-weight:800;display:flex;align-items:center;gap:10px}
.sec-title h2 .hex{width:16px;height:18px;flex:none}
.card h3{font-family:var(--display);font-weight:700;letter-spacing:.02em}
.kpi .v{font-family:var(--display);font-weight:800}
nav a:hover,nav a:focus-visible{border-color:var(--nissa);color:var(--nissa)}
button{background:var(--nissa);border-color:var(--nissa);color:#fff}
button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
button.danger{background:var(--card);color:var(--bad);border-color:var(--line)}
.drop.over{border-color:var(--nissa)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.kpi .l{min-height:2.6em}
@media (max-width:520px){.mast{gap:12px;padding:12px 14px}.mast img{width:52px}}

.mast .t{flex:1}
.mast .opp{width:72px;height:72px;object-fit:contain;flex:none}
.mast img.opp{width:auto;max-width:120px;background:#ffffff;border-radius:10px;padding:5px;box-sizing:border-box}
.mast .ph{display:flex;align-items:center;justify-content:center;background:var(--track);clip-path:polygon(50% 0,100% 18%,92% 78%,50% 100%,8% 78%,0 18%);font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px}
.mast .addlogo{background:transparent;border:0;color:var(--nissa);font-size:11px;padding:4px;letter-spacing:.02em}
@media (max-width:520px){.mast .opp{width:52px;height:52px}}
@media print{.mast .addlogo{display:none}}
.mast .opps{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.mast .opps img{height:40px;width:auto;background:#fff;border-radius:6px;padding:3px}
.mast .opps .mini{height:40px;min-width:34px;display:flex;align-items:center;justify-content:center;background:var(--track);border-radius:6px;font-weight:700;font-size:11px;color:var(--muted)}
.cmp-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cmp-ctl label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp-head{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.cmp-head .pa,.cmp-head .pb{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;display:flex;flex-direction:column;gap:2px}
.cmp-head .pa{color:var(--b1)} .cmp-head .pb{color:var(--nissa);text-align:right}
.cmp-head small{font-family:var(--font);font-weight:500;font-size:11px;color:var(--muted);text-transform:none}
.cmp-head .score{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--muted)}
.cmp-head .score b{font-family:var(--display);font-size:26px;color:var(--ink)}
.cmp-group{display:flex;flex-direction:column;gap:2px;padding-block:10px;border-bottom:1px solid var(--line);break-inside:avoid}
.cmp-group h4{margin:0 0 6px;font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.cmp-row{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(120px,190px) minmax(0,1fr) 52px;gap:8px;align-items:center;min-height:24px}
.cmp-row .va,.cmp-row .vb{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.cmp-row .va{text-align:right} .cmp-row .win{color:var(--ink);font-weight:800}
.cmp-row .ba,.cmp-row .bb{display:flex;height:12px;background:var(--track);border-radius:3px;overflow:hidden}
.cmp-row .ba{justify-content:flex-end}
.cmp-row .ba i{background:var(--b1);display:block;height:100%}
.cmp-row .bb i{background:var(--nissa);display:block;height:100%}
.cmp-row .lab{text-align:center;font-size:12px;font-weight:500}
.cmp-row .lab em{display:block;font-style:normal;font-size:10px;color:var(--muted)}
@media (max-width:520px){.cmp-row{grid-template-columns:40px minmax(0,1fr) 96px minmax(0,1fr) 40px;gap:5px}.cmp-row .lab{font-size:11px}.cmp-head .pa,.cmp-head .pb{font-size:15px}}
.export-ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
.export-ov div{display:flex;flex-direction:column;gap:4px;align-items:center;font-size:14px}
.export-ov span{color:var(--muted);font-size:12px}
.exporting body{overflow:hidden}
.exporting .wrap{max-width:none;width:1100px;padding-inline:0}
.exporting #report{width:1100px}
.exporting nav,.exporting .no-print,.exporting .addlogo{display:none!important}
.exporting .grid2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)!important}
.exporting .tl svg{min-width:0}
.exporting .tw{overflow:visible}
.exporting table{font-size:11px}
.exporting th{font-size:9px;letter-spacing:.03em;white-space:normal}
.exporting th,.exporting td{padding:4px 5px}
.exporting th.on::after{content:""}
.exporting .kpis{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.lock{max-width:520px}
.lockform{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.lockform label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:1;min-width:180px}
.mtab th,.mtab td{text-align:center;padding:5px 6px}
.mtab th:first-child,.mtab td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
.mtab th.played{color:var(--nissa)}
.mtab td.mi{padding:2px}
.mtab input{width:46px;font:inherit;font-size:12px;text-align:center;padding:4px 2px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);-moz-appearance:textfield}
.mtab input::-webkit-outer-spin-button,.mtab input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mtab input:focus{border-color:var(--nissa);outline:none}
.pbadge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 4px;margin-right:7px;border-radius:4px;background:var(--ink);color:var(--card);font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;vertical-align:1px;box-sizing:border-box}
.pbadge.empty{background:transparent}
.addp{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.addp h4{margin:0;font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.addp-f{display:grid;grid-template-columns:minmax(140px,2fr) minmax(120px,2fr) minmax(80px,1fr) minmax(70px,1fr) auto;gap:10px;align-items:end}
.addp-f label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.addp-f input,.addp-f select{width:100%;box-sizing:border-box;font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
@media (max-width:640px){.addp-f{grid-template-columns:1fr 1fr}}
.mtab .rm{margin-left:6px;border:0;background:transparent;color:var(--muted);font-size:14px;line-height:1;padding:2px 5px;border-radius:4px;text-transform:none;letter-spacing:0;font-weight:600;cursor:pointer;opacity:.5}
.mtab tr:hover .rm,.mtab .rm:focus-visible{opacity:1}
.mtab .rm.armed{opacity:1;background:var(--bad);color:#fff;font-size:11px}
.mtab th small{display:block;font-size:8px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);white-space:nowrap}
.ptab th.dom{color:var(--ink)} .ptab th.ext{color:var(--muted)}
.ptab th.dom small:last-child{color:var(--good)}
footer{border-top:1px solid var(--line);padding-top:10px}

</div>

<script>
/* ===== Version autonome (GitHub Pages) : stockage local + fichier donnees.json ===== */
(function(){
  const KEY='nissa-stats-v1';
  let base={matchs:{},logos:{},config:{}};
  try{ const s=document.getElementById('seed'); if(s) base=JSON.parse(s.textContent); }catch(e){}
  let local={matchs:{},logos:{},config:{}};
  try{ const l=JSON.parse(localStorage.getItem(KEY)); if(l) local=Object.assign({matchs:{},logos:{},config:{}},l); }catch(e){}
  const listeners={matchs:[],logos:[],config:[]};
  const merged=col=>{ const o={...(base[col]||{})}; for(const [k,v] of Object.entries(local[col]||{})){ if(v===null) delete o[k]; else o[k]=v; } return o; };
  const snap=col=>{ const docs=Object.entries(merged(col)).map(([id,d])=>({id,exists:true,data:()=>d})); return {docs,size:docs.length,empty:!docs.length}; };
  const emit=col=>{ const s=snap(col); (listeners[col]||[]).forEach(f=>f(s)); updateBadge(); };
  const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(local)); }catch(e){ throw {code:'quota_exceeded',message:'Stockage du navigateur plein.'}; } };
  const pending=()=>['matchs','logos','config','temps','effectif'].reduce((n,k)=>n+Object.keys(local[k]||{}).length,0);
  function updateBadge(){ const b=document.getElementById('btnData'); if(b) b.textContent=pending()?`Télécharger donnees.json (${pending()} modif.)`:'Télécharger donnees.json'; }
  const docRef=(col,id)=>({
      set:async d=>{ local[col]=local[col]||{}; local[col][id]=d; persist(); emit(col); },
      delete:async()=>{ local[col]=local[col]||{}; local[col][id]=null; persist(); emit(col); },
      get:async()=>{ const d=merged(col)[id]; return {id,exists:!!d,data:()=>d}; },
      onSnapshot:f=>{ const run=()=>{ const d=merged(col)[id]; f({id,exists:!!d,data:()=>d}); }; (listeners[col]=listeners[col]||[]).push(run); setTimeout(run,0); return ()=>{}; }
  });
  const db={doc:path=>{ const [c,id]=path.split('/'); return docRef(c,id); }, collection:col=>({
    doc:id=>docRef(col,id),
    onSnapshot:f=>{ (listeners[col]=listeners[col]||[]).push(f); setTimeout(()=>f(snap(col)),0); return ()=>{}; }
  })};
  function download(filename,data){
    const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});
    const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
  }
  const ready=Promise.race([
    fetch('donnees.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.matchs){ const seed=base; base=Object.assign({config:{}},j); for(const k in seed){ if(!base[k]||!Object.keys(base[k]).length) base[k]=seed[k]; } ['matchs','logos','config','temps','effectif'].forEach(emit); } }).catch(()=>{}),
    new Promise(r=>setTimeout(r,4000))]);
  const ADMIN_KEY='nissa-admin';
  const sha=async t=>{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); };
  const adminHash=()=>{ const c=merged('config').admin; return c&&c.hash||null; };
  const isAdmin=()=>{ let v=null; try{ v=localStorage.getItem(ADMIN_KEY); }catch(e){} return !!v && v===adminHash(); };
  window.claude={use:async n=>{ await ready; return n==='db'?db : n==='user'?{can:async()=>isAdmin(),isOwner:async()=>isAdmin(),canEdit:async()=>isAdmin()} : n==='downloads'?{save:async({filename,data})=>download(filename,data)} : null; }};
  // donnees.json du dépôt (si la page est servie par GitHub Pages ou un serveur)

  function adminScreen(){
    const has=!!adminHash();
    const ov=document.createElement('div'); ov.className='export-ov';
    ov.innerHTML=`<form id="admForm" class="card" style="max-width:420px;width:calc(100% - 32px);display:flex;flex-direction:column;gap:12px"><h3 style="margin:0">${has?'Connexion administrateur':'Créer le mot de passe administrateur'}</h3><p class="sub" style="margin:0">${has?'Entre le mot de passe pour importer des matchs, exporter en PDF et gérer le code de la fiche comparaison.':'Choisis un mot de passe (6 caractères minimum). Il faudra ensuite télécharger donnees.json et le déposer sur GitHub pour qu’il soit actif partout.'}</p><input type="password" id="admPwd" autocomplete="off" required minlength="6" style="font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px"><p class="msg" id="admMsg"></p><div style="display:flex;gap:8px"><button type="submit">${has?'Se connecter':'Créer'}</button><button type="button" class="ghost" id="admCancel">Annuler</button></div></form>`;
    document.body.appendChild(ov);
    const leave=()=>{ history.replaceState(null,'',location.pathname+location.search); location.reload(); };
    ov.querySelector('#admCancel').addEventListener('click',()=>{ if(location.hash==='#admin') leave(); else ov.remove(); });
    ov.querySelector('#admForm').addEventListener('submit',async e=>{ e.preventDefault(); const v=ov.querySelector('#admPwd').value; const m=ov.querySelector('#admMsg');
      if(v.length<6){ m.className='msg err'; m.textContent='6 caractères minimum.'; return; }
      const h=await sha('nissa-admin:'+v);
      if(has){ if(h!==adminHash()){ m.className='msg err'; m.textContent='Mot de passe incorrect.'; return; } }
      else { local.config=local.config||{}; local.config.admin={hash:h}; persist(); }
      try{ localStorage.setItem(ADMIN_KEY,h); }catch(err){}
      leave(); });
  }
  window.addEventListener('hashchange',async()=>{ await ready; if(location.hash==='#admin'&&!document.getElementById('admForm')) adminScreen(); if(location.hash==='#lecteur'){ try{ localStorage.removeItem(ADMIN_KEY); }catch(e){} history.replaceState(null,'',location.pathname+location.search); location.reload(); } });
  document.addEventListener('DOMContentLoaded',async()=>{
    await ready;
    if(location.hash==='#admin'){ adminScreen(); }
    if(location.hash==='#lecteur'){ try{ localStorage.removeItem(ADMIN_KEY); }catch(e){} history.replaceState(null,'',location.pathname+location.search); }
    const right=document.querySelector('.bar-tools .right'); if(!right) return;
    const lg=document.createElement('button'); lg.type='button'; lg.className='ghost'; lg.id='btnLogin';
    if(isAdmin()){ lg.textContent='Déconnexion'; lg.addEventListener('click',()=>{ try{ localStorage.removeItem(ADMIN_KEY); }catch(e){} location.reload(); }); }
    else { lg.textContent='Connexion'; lg.addEventListener('click',()=>adminScreen()); }
    right.appendChild(lg);
    if(!isAdmin()) return;
    const b=document.createElement('button'); b.type='button'; b.id='btnData'; b.className='ghost';
    b.title='Contient tous les matchs et logos (dépôt + ajouts faits sur cet ordinateur). À déposer dans le dépôt GitHub pour que tout le staff les voie.';
    b.addEventListener('click',()=>download('donnees.json',JSON.stringify({matchs:merged('matchs'),logos:merged('logos'),config:merged('config'),temps:merged('temps'),effectif:merged('effectif')})));
    right.insertBefore(b,right.firstChild); updateBadge();
  });
})();

</script>
<script>
const v = (p,k)=>p[k]||0;
const sum = k => P.reduce((s,p)=>s+v(p,k),0);
const pct = (a,b)=> b? Math.round(100*a/b) : null;
const C = {b1:'var(--b1)',b2:'var(--b2)',b3:'var(--b3)',red:'var(--red)',or:'var(--orange)'};
const h = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function status(val, good, warn, higherIsBetter=true){
  if(val==null) return ['info','—'];
  if(higherIsBetter) return val>=good?['good','Bon']:val>=warn?['warn','À surveiller']:['bad','Alerte'];
  return val<=good?['good','Bon']:val<=warn?['warn','À surveiller']:['bad','Trop'];
}
function kpi(l,val,s,st){ if(/^(null|NaN)/.test(String(val))) {val='–';st=['info','Pas de donnée'];} return `<div class="card kpi"><div class="l">${l}</div><div class="v">${val}</div><div class="s">${s}</div>${st?`<span class="chip ${st[0]}">${st[1]}</span>`:''}</div>`; }
function pctCls(x,good,low){ return x==null?'':x>=good?'g':x<low?'r':''; }

function stacked(title, sub, legend, rows, opts={}){
  rows = rows.filter(r=>r.segs.reduce((a,s)=>a+s.v,0)>0).sort((a,b)=>b.tot-a.tot || (b.pc??0)-(a.pc??0));
  if(!rows.length) return `<div class="card"><h3>${title}</h3><p class="sub">Aucune action codée.</p></div>`;
  const max = Math.max(...rows.map(r=>r.tot));
  const step = max>12?4:max>6?2:1, top=Math.ceil(max/step)*step;
  const lg = legend.map(([n,c])=>`<span><i style="background:${c};box-shadow:inset 0 0 0 1px ${c==='var(--card-white)'?'var(--ink)':'transparent'}"></i>${n}</span>`).join('') + (opts.pcLabel?`<span>· ${opts.pcLabel}</span>`:'');
  const rs = rows.map(r=>`<div class="prow" title="${h(r.name)} : ${r.segs.map(s=>s.n+' '+s.v).join(', ')}"><span class="nm">${badge(r.name)}${h(r.name)}</span><span class="track">${r.segs.filter(s=>s.v).map(s=>`<b style="width:${100*s.v/top}%;background:${s.c}${s.o?';box-shadow:inset 0 0 0 1px var(--ink)':''}"></b>`).join('')}</span><span class="pc ${r.cls||''}">${r.pcTxt??''}</span></div>`).join('');
  let ticks=''; for(let t=0;t<=top;t+=step) ticks+=`<span style="left:${100*t/top}%">${t}</span>`;
  return `<div class="card"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}<div class="legend">${lg}</div>${rs}<div class="axis"><span></span><div class="ticks">${ticks}</div><span></span></div></div>`;
}
function breakdown(title, sub, items){
  if(!items.length) return `<div class="card"><h3>${title}</h3><p class="sub">Aucune action codée.</p></div>`;
  const max = Math.max(...items.map(i=>i.v),1);
  return `<div class="card"><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}<div class="brk">${items.map(i=>`<div class="it"><div class="top"><span>${h(i.n)}${i.e?` <em>(${h(i.e)})</em>`:''}</span><b>${i.t??i.v}</b></div><div class="bar"><i style="width:${100*i.v/max}%;background:${i.c}"></i></div></div>`).join('')}</div></div>`;
}
function retenir(items){
  return `<div class="card"><h3>À retenir</h3><ul class="ret">${items.filter(Boolean).map(([cls,lab,txt])=>`<li><span class="chip ${cls}">${lab}</span><span>${txt}</span></li>`).join('')}</ul></div>`;
}
function timeline(rows, sector, title, sub){
  if(SEASON) return '';
  const W=1000, L=118, R=16, rowH=26, top=14, H=top+rows.length*rowH+30, T=TMAX;
  const x=t=>L+(W-L-R)*t/T;
  let g=HT?`<rect x="${x(HT[0])}" y="${top-6}" width="${x(HT[1])-x(HT[0])}" height="${rows.length*rowH+2}" fill="var(--track)"/><text x="${(x(HT[0])+x(HT[1]))/2}" y="${top+4}" text-anchor="middle" style="font-size:10px">mi-temps</text>`:'';
  for(let m=0;m<=T;m+=10){ g+=`<line x1="${x(m)}" x2="${x(m)}" y1="${top-6}" y2="${top+rows.length*rowH-4}" stroke="var(--line)"/><text x="${x(m)}" y="${H-8}" text-anchor="middle">${m}'</text>`; }
  rows.forEach((r,i)=>{
    const y=top+i*rowH+rowH/2;
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="0" y="${y+4}">${h(r.label)}</text>`;
    EV.filter(e=>e[1]===sector && r.match(e)).forEach(e=>{
      const fill = r.color ? r.color(e) : (e[3]? 'var(--b2)':'none');
      const stroke = (r.stroke&&r.stroke(e)) || (r.color ? r.color(e) : (e[3]? 'var(--b2)':'var(--red)'));
      g+=`<circle cx="${x(e[0]).toFixed(1)}" cy="${y}" r="5" fill="${fill}" stroke="${stroke}" stroke-width="${fill==='none'?2:(r.stroke&&r.stroke(e)?1.5:0)}" fill-opacity=".9"><title>${Math.floor(e[0])}' · ${h(e[2])} · ${h(e[4])}${e[3]?'':' (raté)'}</title></circle>`;
    });
  });
  return `<div class="card"><div class="card-head"><h3>${title||'Déroulé des actions'}</h3><span>${sub||'Temps vidéo en minutes · plein = réussi, creux = raté'}</span></div><div class="tl"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Déroulé chronologique des actions">${g}</svg></div></div>`;
}
let tid=0;
function table(cols, rows){
  const id='t'+(tid++);
  return `<div class="card"><h3>Tableau joueurs</h3><div class="tw"><table id="${id}" data-cols='${JSON.stringify(cols.map(c=>c.k))}'><thead><tr>${cols.map((c,i)=>`<th tabindex="0" data-i="${i}"${i===0?' class="on asc"':''}>${c.n}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map((c,ci)=>{const val=c.f(r);const raw=c.s?c.s(r):(typeof val==='number'?val:val);const zero=(val===0||val==null||val==='–');return `<td data-v="${raw??-1}" class="${zero?'d':''} ${c.cls?c.cls(r):''}">${ci===0&&r.name?badge(r.name):''}${zero?'–':val}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
const fr = (a,b)=> b? `${a}/${b}`:'–';
const pctTxt = x => x==null?'–':x+' %';
const pkey = n=>'P'+String(typeof posteOf==='function'&&posteOf(n)||99).padStart(2,'0')+' '+n;
const byName = (a,b)=>pkey(a.name).localeCompare(pkey(b.name),'fr');
const leader = (k,n=1,arr=P)=>{const l=[...arr].filter(p=>v(p,k)>0).sort((a,b)=>v(b,k)-v(a,k)).slice(0,n);return l.length?l:[null];};

function sec(id,title,sub,html){ return `<section class="sector" id="${id}"><div class="sec-title"><h2><svg class="hex" viewBox="0 0 16 18" aria-hidden="true"><polygon points="8,0 16,3.2 14.7,14 8,18 1.3,14 0,3.2" fill="var(--nissa)"/></svg>${title}</h2><span>${sub}</span></div>${html}</section>`; }

/* ---------- DÉFENSE ---------- */
function defense(){
  const ok=sum('plaq_ok'), miss=sum('plaq_rate'), dom=sum('plaq_dom'), subi=sum('plaq_subi'), neu=ok-dom-subi, ap=sum('ast_pos'), an=sum('ast_neg');
  const rp=pct(ok,ok+miss);
  const k = `<div class="kpis">${kpi('Réussite plaquage',rp+' %',`${ok} réussis · ${miss} manqués`,status(rp,90,80))}${kpi('Plaquages dominants',pct(dom,ok)+' %',`${dom} dominants sur ${ok} réussis`,status(pct(dom,ok),25,15))}${kpi('Duels perdus au plaquage',subi,`plaquage réussi mais recul`,status(subi,5,10,false))}${kpi('Assistants',pct(ap,ap+an)+' %',`${ap} / ${ap+an} réussis`,status(pct(ap,ap+an),90,75))}${kpi('Plaquages manqués',miss,`sur ${ok+miss} tentés`,status(miss,8,12,false))}${kpi('Ballons récupérés',sum('recup'),sum('recup')?`par ${P.filter(p=>v(p,'recup')).length} joueurs`:'aucun codé',null)}</div>`;
  const rows=P.map(p=>{const t=v(p,'plaq_ok')+v(p,'plaq_rate');const x=pct(v(p,'plaq_ok'),t);return {name:p.name,tot:t,pc:x,pcTxt:t?x+' %':'',cls:pctCls(x,100,75),segs:[{n:'Dominant',v:v(p,'plaq_dom'),c:C.b1},{n:'Réussi',v:v(p,'plaq_ok')-v(p,'plaq_dom')-v(p,'plaq_subi'),c:C.b2},{n:'Réussi –',v:v(p,'plaq_subi'),c:C.b3},{n:'Manqué',v:v(p,'plaq_rate'),c:C.red}]};});
  const chart=stacked('Plaquages par joueur','',[['Dominant',C.b1],['Réussi',C.b2],['Réussi – (duel perdu)',C.b3],['Manqué',C.red]],rows,{pcLabel:'% = réussite au plaquage'});
  const issue=breakdown('Issue du plaquage','Répartition des plaquages tentés selon l’issue du duel.',[{n:'Dominant',v:dom,c:C.b1},{n:'Réussi (neutre)',v:neu,c:C.b2},{n:'Réussi – (duel perdu)',v:subi,c:C.b3},{n:'Manqué',v:miss,c:C.red}]);
  const astP=P.filter(p=>v(p,'ast_pos')+v(p,'ast_neg')).sort((a,b)=>v(b,'ast_pos')-v(a,'ast_pos')).slice(0,6);
  const ast=breakdown('Assistants au plaquage','Joueurs les plus présents en second plaqueur.',astP.map(p=>({n:p.name,v:v(p,'ast_pos'),t:fr(v(p,'ast_pos'),v(p,'ast_pos')+v(p,'ast_neg')),c:C.b2})));
  const vol=leader('plaq_ok')[0];
  const rel=P.filter(p=>v(p,'plaq_ok')>=4&&!v(p,'plaq_rate')).map(p=>p.name);
  const missers=P.filter(p=>v(p,'plaq_rate')>=2).sort((a,b)=>v(b,'plaq_rate')-v(a,'plaq_rate'));
  const domL=leader('plaq_dom')[0];
  const ret=retenir([
    vol&&['good','Volume',`${vol.name} : ${v(vol,'plaq_ok')} plaquages réussis sur ${v(vol,'plaq_ok')+v(vol,'plaq_rate')}.`],
    rel.length?['good','Fiabilité',`100 % de réussite (4+ plaquages) : ${rel.join(', ')}.`]:null,
    domL&&['good','Domination',`${domL.name} : ${v(domL,'plaq_dom')} plaquages dominants.`],
    leader('recup')[0]&&['good','Récupération',`${leader('recup')[0].name} : ${v(leader('recup')[0],'recup')} ballon${v(leader('recup')[0],'recup')>1?'s':''} récupéré${v(leader('recup')[0],'recup')>1?'s':''}.`],
    missers.length?['bad','Manqués',`${missers.map(p=>`${p.name} (${v(p,'plaq_rate')})`).join(', ')} : ${missers.reduce((s,p)=>s+v(p,'plaq_rate'),0)} des ${miss} plaquages manqués.`]:null]);
  const tl=timeline([{label:'Plaq. manqué',match:e=>e[2]==='Plaq. manqué'},{label:'Ballon récupéré',match:e=>e[2]==='Ballon récupéré',color:()=>'var(--b1)'}],'def');
  const tb=table([
    {n:'Joueur',f:p=>p.name,s:p=>pkey(p.name)},
    {n:'Tentés',f:p=>v(p,'plaq_ok')+v(p,'plaq_rate')},
    {n:'Réussis',f:p=>v(p,'plaq_ok')},{n:'Manqués',f:p=>v(p,'plaq_rate')},
    {n:'Réussite',f:p=>pctTxt(pct(v(p,'plaq_ok'),v(p,'plaq_ok')+v(p,'plaq_rate'))),s:p=>pct(v(p,'plaq_ok'),v(p,'plaq_ok')+v(p,'plaq_rate')),cls:p=>'pct '+pctCls(pct(v(p,'plaq_ok'),v(p,'plaq_ok')+v(p,'plaq_rate')),100,75)},
    {n:'Dom.',f:p=>v(p,'plaq_dom')},{n:'Neutre',f:p=>v(p,'plaq_ok')-v(p,'plaq_dom')-v(p,'plaq_subi')},{n:'–',f:p=>v(p,'plaq_subi')},
    {n:'Assistants',f:p=>v(p,'ast_pos')+v(p,'ast_neg')?fr(v(p,'ast_pos'),v(p,'ast_pos')+v(p,'ast_neg')):'–',s:p=>v(p,'ast_pos')},{n:'Récup.',f:p=>v(p,'recup')}],[...P].sort(byName));
  return sec('defense','Défense','Plaquages et assistants',k+`<div class="grid2">${chart}<div class="side">${issue}${ast}${ret}</div></div>`+tl+tb);
}

/* ---------- ATTAQUE ---------- */
function attaque(){
  const dp=sum('duel_pos'), dn=sum('duel_neg'), pp=sum('passe_pos'), pn=sum('passe_neg'), op=sum('off_pos'), on=sum('off_neg'), db=sum('defbattu'), fr_=sum('franch'), esp=sum('espace_pos'), pdb=sum('pdb');
  const k=`<div class="kpis">${kpi('Duels au contact',pct(dp,dp+dn)+' %',`${dp} gagnés · ${dn} perdus`,status(pct(dp,dp+dn),75,65))}${kpi('Passes',pct(pp,pp+pn)+' %',`${pp} / ${pp+pn} réussies`,status(pct(pp,pp+pn),92,85))}${kpi('Défenseurs battus',db,`+ ${fr_} franchissements · ${esp} duels espace gagnés`,null)}${kpi('Offloads',pct(op,op+on)+' %',`${op} / ${op+on} réussis`,status(pct(op,op+on),75,60))}${kpi('Pertes de balle',pdb,`ballons perdus en attaque`,status(pdb,10,15,false))}</div>`;
  const rows=P.map(p=>{const t=v(p,'duel_pos')+v(p,'duel_neg');const x=pct(v(p,'duel_pos'),t);return {name:p.name,tot:t+v(p,'defbattu'),pc:x,pcTxt:t?x+' %':'',cls:pctCls(x,80,60),segs:[{n:'Duel gagné',v:v(p,'duel_pos'),c:C.b2},{n:'Duel perdu',v:v(p,'duel_neg'),c:C.red},{n:'Déf. battu',v:v(p,'defbattu'),c:C.b1}]};});
  const chart=stacked('Ballons portés par joueur','',[['Duel contact gagné',C.b2],['Duel contact perdu',C.red],['Défenseur battu',C.b1]],rows,{pcLabel:'% = duels gagnés'});
  const pas=breakdown('Jeu de passe','Passes et offloads codés.',[{n:'Passe réussie',v:pp,c:C.b2},{n:'Passe ratée',v:pn,c:C.red},{n:'Offload réussi',v:op,c:C.b1},{n:'Offload raté',v:on,c:C.red}]);
  const pl=P.filter(p=>v(p,'pdb')).sort((a,b)=>v(b,'pdb')-v(a,'pdb')).slice(0,6);
  const pdbC=breakdown('Pertes de balle','Joueurs les plus concernés.',pl.map(p=>({n:p.name,v:v(p,'pdb'),c:C.or})));
  const du=leader('duel_pos')[0], dbL=leader('defbattu')[0], pas1=leader('passe_pos')[0];
  const franch=P.filter(p=>v(p,'franch')).map(p=>p.name);
  const pdbTop=pl.filter(p=>v(p,'pdb')>=3);
  const ret=retenir([
    du&&['good','Avancée',`${du.name} : ${v(du,'duel_pos')} duels au contact gagnés sur ${v(du,'duel_pos')+v(du,'duel_neg')}.`],
    dbL&&['good','Déf. battus',`${dbL.name} : ${v(dbL,'defbattu')} défenseurs battus${franch.length?` · franchissements : ${franch.join(', ')}`:''}.`],
    pas1&&['good','Distribution',`${pas1.name} : ${v(pas1,'passe_pos')} passes réussies sur ${v(pas1,'passe_pos')+v(pas1,'passe_neg')}.`],
    pdbTop.length?['bad','Pertes',`${pdbTop.map(p=>`${p.name} (${v(p,'pdb')})`).join(', ')} : ${pdbTop.reduce((s,p)=>s+v(p,'pdb'),0)} des ${pdb} pertes de balle.`]:null]);
  const tl=timeline([{label:'Déf. battu',match:e=>e[2]==='Déf. battu / franch.'},{label:'Offload',match:e=>e[2]==='Offload'},{label:'Perte de balle',match:e=>e[2]==='Perte de balle',color:()=>'var(--orange)'}],'att');
  const tb=table([
    {n:'Joueur',f:p=>p.name,s:p=>pkey(p.name)},
    {n:'Contact +',f:p=>v(p,'duel_pos')},{n:'Contact –',f:p=>v(p,'duel_neg')},
    {n:'% contact',f:p=>pctTxt(pct(v(p,'duel_pos'),v(p,'duel_pos')+v(p,'duel_neg'))),s:p=>pct(v(p,'duel_pos'),v(p,'duel_pos')+v(p,'duel_neg')),cls:p=>'pct '+pctCls(pct(v(p,'duel_pos'),v(p,'duel_pos')+v(p,'duel_neg')),80,60)},
    {n:'Déf. battus',f:p=>v(p,'defbattu')},{n:'Franch.',f:p=>v(p,'franch')},{n:'Duels espace',f:p=>v(p,'espace_pos')+v(p,'espace_neg')?fr(v(p,'espace_pos'),v(p,'espace_pos')+v(p,'espace_neg')):'–',s:p=>v(p,'espace_pos')},{n:'% espace',f:p=>pctTxt(pct(v(p,'espace_pos'),v(p,'espace_pos')+v(p,'espace_neg'))),s:p=>pct(v(p,'espace_pos'),v(p,'espace_pos')+v(p,'espace_neg')),cls:p=>'pct '+pctCls(pct(v(p,'espace_pos'),v(p,'espace_pos')+v(p,'espace_neg')),80,50)},
    {n:'Passes',f:p=>v(p,'passe_pos')+v(p,'passe_neg')?fr(v(p,'passe_pos'),v(p,'passe_pos')+v(p,'passe_neg')):'–',s:p=>v(p,'passe_pos')},
    {n:'Offloads',f:p=>v(p,'off_pos')+v(p,'off_neg')?fr(v(p,'off_pos'),v(p,'off_pos')+v(p,'off_neg')):'–',s:p=>v(p,'off_pos')},
    {n:'PDB',f:p=>v(p,'pdb'),cls:p=>v(p,'pdb')>=3?'r':''}],[...P].sort(byName));
  return sec('attaque','Attaque','Duels, passes et pertes de balle',k+`<div class="grid2">${chart}<div class="side">${pas}${pdbC}${ret}</div></div>`+tl+tb);
}

/* ---------- RUCK OFFENSIF ---------- */
function ruckOff(){
  const ro=sum('ro'), rp=sum('ro_pos'), rn=sum('ro_neg'), r1=sum('ro_1er');
  const k=`<div class="kpis">${kpi('Efficacité',pct(rp,ro)+' %',`${rp} / ${ro} rucks réussis`,status(pct(rp,ro),92,85))}${kpi('Rucks offensifs',ro,`par ${P.filter(p=>v(p,'ro')).length} joueurs`,null)}${kpi('1er arrivé',pct(r1,ro)+' %',`${r1} rucks en 1er soutien`,null)}${kpi('Rucks ratés',rn,`sur ${ro} rucks`,status(rn,8,14,false))}</div>`;
  const rows=P.map(p=>{const x=pct(v(p,'ro_pos'),v(p,'ro'));return {name:p.name,tot:v(p,'ro'),pc:x,pcTxt:v(p,'ro')?x+' %':'',cls:pctCls(x,100,85),segs:[{n:'Réussi',v:v(p,'ro_pos'),c:C.b2},{n:'Raté',v:v(p,'ro_neg'),c:C.red}]};});
  const chart=stacked('Ruck offensif par joueur','Nombre de rucks offensifs codés (tous rôles).',[['Ruck réussi',C.b2],['Ruck raté',C.red]],rows,{pcLabel:'% = efficacité'});
  const roles=breakdown('Rôle au ruck','Répartition des rucks offensifs par rôle.',[{n:'Ancreur',v:sum('ro_ancreur'),c:C.b1},{n:'Raseur',v:sum('ro_raseur'),c:C.b2},{n:'Latcheur',v:sum('ro_latcheur'),c:C.b3}]);
  const ranks=(sum('ro_r2')+sum('ro_r3')+sum('ro_r4'))?breakdown('Rang d’arrivée','Ordre d’arrivée du joueur sur le ruck.',[{n:'1er',v:r1,c:C.b1},{n:'2e',v:sum('ro_r2'),c:C.b2},{n:'3e',v:sum('ro_r3'),c:C.b3},{n:'4e et +',v:sum('ro_r4'),c:C.b3}]):'';
  const vol=leader('ro')[0], first=leader('ro_1er')[0];
  const rel=P.filter(p=>v(p,'ro')>=10&&!v(p,'ro_neg')).map(p=>p.name);
  const neg=P.filter(p=>v(p,'ro_neg')>=2).sort((a,b)=>v(b,'ro_neg')-v(a,'ro_neg'));
  const ret=retenir([
    vol&&['good','Volume',`${vol.name} : ${v(vol,'ro')} rucks offensifs, ${pct(v(vol,'ro_pos'),v(vol,'ro'))} % d’efficacité.`],
    first&&['good','1er arrivé',`${first.name} : ${v(first,'ro_1er')} rucks en premier soutien.`],
    rel.length?['good','Fiabilité',`100 % d’efficacité (10+ rucks) : ${rel.join(', ')}.`]:null,
    neg.length?['bad','Ratés',`${neg.map(p=>`${p.name} (${v(p,'ro_neg')})`).join(', ')}.`]:null]);
  const tb=table([
    {n:'Joueur',f:p=>p.name,s:p=>pkey(p.name)},
    {n:'Rucks off.',f:p=>v(p,'ro')},{n:'Réussis',f:p=>v(p,'ro_pos')},{n:'Ratés',f:p=>v(p,'ro_neg'),cls:p=>v(p,'ro_neg')>=2?'r':''},
    {n:'Efficacité',f:p=>pctTxt(pct(v(p,'ro_pos'),v(p,'ro'))),s:p=>pct(v(p,'ro_pos'),v(p,'ro')),cls:p=>'pct '+pctCls(pct(v(p,'ro_pos'),v(p,'ro')),100,85)},
    {n:'1er arrivé',f:p=>v(p,'ro_1er')},{n:'Ancreur',f:p=>v(p,'ro_ancreur')},{n:'Raseur',f:p=>v(p,'ro_raseur')},{n:'Latcheur',f:p=>v(p,'ro_latcheur')}],[...P].sort(byName));
  return sec('ruck-off','Ruck offensif','Soutien, rôle et efficacité sur nos rucks',k+`<div class="grid2">${chart}<div class="side">${roles}${ranks}${ret}</div></div>`+tb);
}

/* ---------- RUCK DÉFENSIF ---------- */
function ruckDef(){
  const rd=sum('rd'), rdp=sum('rd_pos'), gT=sum('gratt'), gOk=sum('gratt_pos'), cT=sum('contre'), cOk=sum('contre_pos');
  const k=`<div class="kpis">${kpi('Réussite ruck déf.',pct(rdp,rd)+' %',`${rdp} / ${rd} actions réussies`,status(pct(rdp,rd),50,30))}${kpi('Grattages',pct(gOk,gT)+' %',`${gOk} / ${gT} réussis`,status(pct(gOk,gT),50,30))}${kpi('Contres-rucks',pct(cOk,cT)+' %',`${cOk} / ${cT} réussis`,status(pct(cOk,cT),60,40))}${kpi('Joueurs impliqués',P.filter(p=>v(p,'rd')).length,`au moins une action au sol`,null)}</div>`;
  const rows=P.map(p=>{const x=pct(v(p,'rd_pos'),v(p,'rd'));return {name:p.name,tot:v(p,'rd'),pc:x,pcTxt:v(p,'rd')?x+' %':'',cls:pctCls(x,75,40),segs:[{n:'Grattage réussi',v:v(p,'gratt_pos'),c:C.b1},{n:'Contre-ruck réussi',v:v(p,'contre_pos'),c:C.b2},{n:'Raté',v:v(p,'rd_neg'),c:C.red}]};});
  const chart=stacked('Ruck défensif par joueur','Grattages et contres-rucks tentés.',[['Grattage réussi',C.b1],['Contre-ruck réussi',C.b2],['Raté',C.red]],rows,{pcLabel:'% = réussite'});
  const rep=breakdown('Répartition','Actions défensives au sol.',[{n:'Grattage réussi',v:gOk,c:C.b1},{n:'Grattage raté',v:gT-gOk,c:C.red},{n:'Contre-ruck réussi',v:cOk,c:C.b2},{n:'Contre-ruck raté',v:cT-cOk,c:C.red}]);
  const best=leader('gratt_pos')[0], ctr=leader('contre_pos')[0];
  const miss=P.filter(p=>v(p,'rd_neg')>=2).sort((a,b)=>v(b,'rd_neg')-v(a,'rd_neg'));
  const ret=retenir([
    best&&['good','Gratteur',`${best.name} : ${v(best,'gratt_pos')} grattage${v(best,'gratt_pos')>1?'s':''} réussi${v(best,'gratt_pos')>1?'s':''} sur ${v(best,'gratt')}.`],
    ctr&&['good','Contre-ruck',`${ctr.name} : ${v(ctr,'contre_pos')} contre${v(ctr,'contre_pos')>1?'s':''}-ruck${v(ctr,'contre_pos')>1?'s':''} réussi${v(ctr,'contre_pos')>1?'s':''}.`],
    miss.length?['bad','Échecs',`${miss.map(p=>`${p.name} (${v(p,'rd_neg')})`).join(', ')} : 2 échecs ou plus au sol.`]:null,
    gT&&['warn','Au sol',`Grattage : ${gOk} réussis sur ${gT} tentés.`]]);
  const tl=timeline([{label:'Grattage',match:e=>e[2]==='Grattage'},{label:'Contre-ruck',match:e=>e[2]==='Contre-ruck'}],'ruck');
  const tb=table([
    {n:'Joueur',f:p=>p.name,s:p=>pkey(p.name)},
    {n:'Rucks déf.',f:p=>v(p,'rd')},{n:'Réussis',f:p=>v(p,'rd_pos')},{n:'Ratés',f:p=>v(p,'rd_neg'),cls:p=>v(p,'rd_neg')>=2?'r':''},
    {n:'Réussite',f:p=>pctTxt(pct(v(p,'rd_pos'),v(p,'rd'))),s:p=>pct(v(p,'rd_pos'),v(p,'rd')),cls:p=>'pct '+pctCls(pct(v(p,'rd_pos'),v(p,'rd')),75,40)},
    {n:'Grattages',f:p=>v(p,'gratt')?fr(v(p,'gratt_pos'),v(p,'gratt')):'–',s:p=>v(p,'gratt_pos')},
    {n:'% gratt.',f:p=>pctTxt(pct(v(p,'gratt_pos'),v(p,'gratt'))),s:p=>pct(v(p,'gratt_pos'),v(p,'gratt')),cls:p=>'pct '+pctCls(pct(v(p,'gratt_pos'),v(p,'gratt')),75,40)},
    {n:'Contres',f:p=>v(p,'contre')?fr(v(p,'contre_pos'),v(p,'contre')):'–',s:p=>v(p,'contre_pos')}],[...P].filter(p=>v(p,'rd')).sort(byName));
  return sec('ruck-def','Ruck défensif','Grattages et contres-rucks',k+`<div class="grid2">${chart}<div class="side">${rep}${ret}</div></div>`+tl+tb);
}
const ruck=()=>ruckOff()+ruckDef();

/* ---------- DISCIPLINE ---------- */
function discipline(){
  const f=sum('faute'), cj=sum('cj');
  const fev=EV.filter(e=>e[2]==='Faute'||e[2].startsWith('Carton'));
  const cb=sum('cb'), cr=sum('cr'), nc=cj+cb+cr;
  const cardTxt=[cj?cj+' CJ':'',cr?cr+' CR':'',cb?cb+' CB':''].filter(Boolean).join(' · ');
  const mt1=fev.filter(e=>e[0]<SPLIT).length, mt2=fev.length-mt1;
  const fl=P.filter(p=>v(p,'faute')).sort((a,b)=>v(b,'faute')-v(a,'faute')||v(b,'cj')-v(a,'cj'));
  const k=`<div class="kpis">${kpi('Fautes concédées',f,`${fl.length} joueurs sanctionnés`,status(f,8,11,false))}${kpi('Cartons',nc,nc?cardTxt:'aucun',cr||cj?['bad','À corriger']:cb?['warn','À surveiller']:['good','Bon'])}${kpi('1re mi-temps',mt1,`fautes avant la pause`,null)}${kpi('2e mi-temps',mt2,`fautes après la pause`,null)}</div>`;
  const rows=fl.map(p=>({name:p.name,tot:v(p,'faute'),pc:0,pcTxt:[v(p,'cr')?'CR':'',v(p,'cj')?'CJ':'',v(p,'cb')?'CB':''].filter(Boolean).join(' '),cls:'r',segs:[{n:'Faute',v:v(p,'faute')-v(p,'cj')-v(p,'cr')-v(p,'cb'),c:C.or},{n:'Carton blanc',v:v(p,'cb'),c:'var(--card-white)',o:1},{n:'Carton jaune',v:v(p,'cj'),c:'var(--card-yellow)'},{n:'Carton rouge',v:v(p,'cr'),c:'var(--card-red)'}]}));
  const chart=stacked('Fautes par joueur','',[['Faute',C.or],...(cb?[['Carton blanc','var(--card-white)']]:[]),['Carton jaune','var(--card-yellow)'],...(cr?[['Carton rouge','var(--card-red)']]:[])],rows,{});
  const per=breakdown('Fautes par période','Temps vidéo.'+(HT?` Mi-temps placée à la coupure entre ${Math.floor(HT[0])}' et ${Math.ceil(HT[1])}'.`:''),[
    {n:'1re MT · 0-20\'',v:fev.filter(e=>e[0]<20).length,c:C.or},{n:'1re MT · 20\'-pause',v:fev.filter(e=>e[0]>=20&&e[0]<SPLIT).length,c:C.or},
    {n:'2e MT · reprise-'+Q4+'\'',v:fev.filter(e=>e[0]>=SPLIT&&e[0]<Q4).length,c:C.or},{n:'2e MT · '+Q4+'\'-fin',v:fev.filter(e=>e[0]>=Q4).length,c:C.or}]);
  const cjP=P.filter(p=>v(p,'cj')).map(p=>p.name);
  const fTop=fl.filter(p=>v(p,'faute')>=2);
  const ret=retenir([
    nc?['bad','Cartons',[['cr','Rouge'],['cj','Jaune'],['cb','Blanc']].filter(([k])=>sum(k)).map(([k,l])=>`${l} : ${P.filter(p=>v(p,k)).map(p=>p.name).join(', ')}`).join(' · ')+'.']:null,
    fTop.length?['bad','Récidive',`${fTop.map(p=>`${p.name} (${v(p,'faute')})`).join(', ')} : 2 fautes ou plus.`]:null,
    fev.length&&['warn','Répartition',`${mt1} fautes en 1re MT, ${mt2} en 2e MT.`],
    fl.length&&['info','Isolées',`${fl.filter(p=>v(p,'faute')===1).length} joueurs avec une seule faute.`]]);
  const tl=timeline([{label:'Faute',match:e=>e[2]==='Faute',color:()=>'var(--orange)'},{label:'Carton',match:e=>e[2].startsWith('Carton'),color:e=>e[2]==='Carton rouge'?'var(--card-red)':e[2]==='Carton blanc'?'var(--card-white)':'var(--card-yellow)',stroke:e=>e[2]==='Carton blanc'?'var(--ink)':null}],'disc',null,'Temps vidéo en minutes · cartons : blanc, jaune, rouge');
  return sec('discipline','Discipline','Fautes et cartons',k+`<div class="grid2">${chart}<div class="side">${per}${ret}</div></div>`+tl);
}

/* ---------- SPÉCIFIQUE ---------- */
function specifique(){
  const mp=sum('melee_pos'), mn=sum('melee_neg');
  const lp=sum('lanceur_pos'), ln=sum('lanceur_neg'), op=sum('tOFF_pos'), on=sum('tOFF_neg'), dp=sum('tDEF_pos'), dn=sum('tDEF_neg');
  const jp=sum('jap_pos'), jn=sum('jap_neg'), ap=sum('aerien_pos'), an=sum('aerien_neg');
  const pts=sum('pts');
  const k=`<div class="kpis">${kpi('Mêlée',pct(mp,mp+mn)+' %',`${mp} + / ${mn} – (tags joueurs)`,status(pct(mp,mp+mn),60,50))}${kpi('Lancers en touche',pct(lp,lp+ln)+' %',`${lp} / ${lp+ln} réussis`,status(pct(lp,lp+ln),85,75))}${kpi('Sauts en touche',pct(op+dp,op+on+dp+dn)+' %',`off. ${op}/${op+on} · déf. ${dp}/${dp+dn}`,status(pct(op+dp,op+on+dp+dn),80,65))}${kpi('Jeu au pied',pct(jp,jp+jn)+' %',`${jp} / ${jp+jn} réussis`,status(pct(jp,jp+jn),80,65))}${kpi('Jeu aérien',pct(ap,ap+an)+' %',`${ap} / ${ap+an} ballons gagnés`,status(pct(ap,ap+an),65,50))}${kpi('Points marqués',pts,`${sum('essai')} E · ${sum('transfo')} T · ${sum('pen')} P${sum('drop')?' · '+sum('drop')+' D':''}`,null)}${(()=>{const bp=sum('transfo')+sum('pen')+sum('drop'),bt=bp+sum('transfo_neg')+sum('pen_neg')+sum('drop_neg');return bt?kpi('Tirs au but',pct(bp,bt)+' %',`${bp} / ${bt} réussis`,status(pct(bp,bt),75,60)):''})()}</div>`;
  const rows=P.map(p=>{const pos=v(p,'melee_pos')+v(p,'lanceur_pos')+v(p,'tOFF_pos')+v(p,'tDEF_pos')+v(p,'jap_pos')+v(p,'aerien_pos');const neg=v(p,'melee_neg')+v(p,'lanceur_neg')+v(p,'tOFF_neg')+v(p,'tDEF_neg')+v(p,'jap_neg')+v(p,'aerien_neg');const x=pct(pos,pos+neg);return {name:p.name,tot:pos+neg,pc:x,pcTxt:pos+neg?x+' %':'',cls:pctCls(x,75,50),segs:[{n:'Mêlée +',v:v(p,'melee_pos'),c:C.b1},{n:'Touche +',v:v(p,'lanceur_pos')+v(p,'tOFF_pos')+v(p,'tDEF_pos'),c:C.b2},{n:'Pied / aérien +',v:v(p,'jap_pos')+v(p,'aerien_pos'),c:C.b3},{n:'Échec',v:neg,c:C.red}]};});
  const chart=stacked('Phases spécifiques par joueur','Mêlée, touche (lanceur et sauteurs), jeu au pied et jeu aérien.',[['Mêlée +',C.b1],['Touche +',C.b2],['Pied / aérien +',C.b3],['Échec',C.red]],rows,{pcLabel:'% = réussite'});
  const fp=(a,b)=>b?`${a}/${b} · ${pct(a,b)} %`:'–';
  const lanc=P.filter(p=>v(p,'lanceur_pos')+v(p,'lanceur_neg')).sort((a,b)=>(v(b,'lanceur_pos')+v(b,'lanceur_neg'))-(v(a,'lanceur_pos')+v(a,'lanceur_neg')));
  const tC=breakdown('Bilan touche','Réussis / tentés et % de réussite.',[{n:'Lancers (total)',v:lp+ln,t:fp(lp,lp+ln),c:C.b1},...lanc.map(p=>{const t=v(p,'lanceur_pos')+v(p,'lanceur_neg'),x=pct(v(p,'lanceur_pos'),t);return {n:'Lanceur · '+p.name,v:t,t:fp(v(p,'lanceur_pos'),t),c:x>=85?C.b1:x>=75?C.b2:C.red};}),{n:'Sauteur offensif',v:op+on,t:fp(op,op+on),c:C.b2},{n:'Sauteur défensif',v:dp+dn,t:fp(dp,dp+dn),c:C.b3}]);
  const sc=P.filter(p=>v(p,'pts')).sort((a,b)=>v(b,'pts')-v(a,'pts'));
  const sC=breakdown('Points marqués','',sc.map(p=>({n:p.name,e:[v(p,'essai')?v(p,'essai')+' E':'',v(p,'transfo')+v(p,'transfo_neg')?fr(v(p,'transfo'),v(p,'transfo')+v(p,'transfo_neg'))+' T':'',v(p,'pen')+v(p,'pen_neg')?fr(v(p,'pen'),v(p,'pen')+v(p,'pen_neg'))+' P':''].filter(Boolean).join(' · '),v:v(p,'pts'),t:v(p,'pts')+' pts',c:C.b1})));
  const kick=leader('jap_pos')[0];
  const jump=[...P].filter(p=>v(p,'tOFF_pos')+v(p,'tDEF_pos')).sort((a,b)=>(v(b,'tOFF_pos')+v(b,'tDEF_pos'))-(v(a,'tOFF_pos')+v(a,'tDEF_pos')))[0];
  const melB=P.filter(p=>v(p,'melee_pos')+v(p,'melee_neg')).sort((a,b)=>pct(v(a,'melee_pos'),v(a,'melee_pos')+v(a,'melee_neg'))-pct(v(b,'melee_pos'),v(b,'melee_pos')+v(b,'melee_neg')))[0];
  const aerN=P.filter(p=>v(p,'aerien_neg')>=2).map(p=>`${p.name} (${v(p,'aerien_neg')})`);
  const ret=retenir([
    melB&&['bad','Mêlée',`${mp} issues positives pour ${mn} négatives codées. Le plus en difficulté : ${melB.name} (${v(melB,'melee_pos')} + / ${v(melB,'melee_neg')} –).`],
    jump&&(v(jump,'tOFF_pos')+v(jump,'tDEF_pos'))&&['good','Touche',`${jump.name} : ${v(jump,'tOFF_pos')+v(jump,'tDEF_pos')} sauts gagnés (off. + déf.).`],
    kick&&['good','Jeu au pied',`${kick.name} : ${v(kick,'jap_pos')} JAP réussis sur ${v(kick,'jap_pos')+v(kick,'jap_neg')}.`],
    aerN.length?['warn','Aérien',`Ballons perdus en l’air : ${aerN.join(', ')}.`]:null]);
  const tl=timeline([{label:'Essai',match:e=>e[2]==='Essai',color:()=>'var(--b1)'},{label:'Transformation',match:e=>e[2]==='Transformation',color:()=>'var(--b2)'},{label:'Pénalité',match:e=>e[2]==='Pénalité',color:()=>'var(--b3)'},...(sum('drop')?[{label:'Drop',match:e=>e[2]==='Drop',color:()=>'var(--b2)'}]:[])],'disc','Points marqués','Temps vidéo en minutes · une ligne par type de points');
  const tb=table([
    {n:'Joueur',f:p=>p.name,s:p=>pkey(p.name)},
    {n:'Mêlée',f:p=>v(p,'melee_pos')+v(p,'melee_neg')?`${v(p,'melee_pos')} + / ${v(p,'melee_neg')} –`:'–',s:p=>v(p,'melee_pos')+v(p,'melee_neg')},
    {n:'Lanceur',f:p=>v(p,'lanceur_pos')+v(p,'lanceur_neg')?fr(v(p,'lanceur_pos'),v(p,'lanceur_pos')+v(p,'lanceur_neg')):'–',s:p=>v(p,'lanceur_pos')},{n:'% lancer',f:p=>pctTxt(pct(v(p,'lanceur_pos'),v(p,'lanceur_pos')+v(p,'lanceur_neg'))),s:p=>pct(v(p,'lanceur_pos'),v(p,'lanceur_pos')+v(p,'lanceur_neg')),cls:p=>'pct '+pctCls(pct(v(p,'lanceur_pos'),v(p,'lanceur_pos')+v(p,'lanceur_neg')),85,75)},
    {n:'Sauteur off.',f:p=>v(p,'tOFF_pos')+v(p,'tOFF_neg')?fr(v(p,'tOFF_pos'),v(p,'tOFF_pos')+v(p,'tOFF_neg')):'–',s:p=>v(p,'tOFF_pos')},
    {n:'Sauteur déf.',f:p=>v(p,'tDEF_pos')+v(p,'tDEF_neg')?fr(v(p,'tDEF_pos'),v(p,'tDEF_pos')+v(p,'tDEF_neg')):'–',s:p=>v(p,'tDEF_pos')},
    {n:'JAP',f:p=>v(p,'jap_pos')+v(p,'jap_neg')?fr(v(p,'jap_pos'),v(p,'jap_pos')+v(p,'jap_neg')):'–',s:p=>v(p,'jap_pos')},
    {n:'Aérien',f:p=>v(p,'aerien_pos')+v(p,'aerien_neg')?fr(v(p,'aerien_pos'),v(p,'aerien_pos')+v(p,'aerien_neg')):'–',s:p=>v(p,'aerien_pos')},
    {n:'Essais',f:p=>v(p,'essai')},{n:'Transfo',f:p=>v(p,'transfo')+v(p,'transfo_neg')?fr(v(p,'transfo'),v(p,'transfo')+v(p,'transfo_neg')):'–',s:p=>v(p,'transfo')},{n:'Pénalités',f:p=>v(p,'pen')+v(p,'pen_neg')?fr(v(p,'pen'),v(p,'pen')+v(p,'pen_neg')):'–',s:p=>v(p,'pen')},
    {n:'Points',f:p=>v(p,'pts')}],[...P].sort(byName));

/* ===== État courant ===== */
let P=[], EV=[], HT=null, TMAX=90, SPLIT=45, Q4=75;

/* ===== Lecture des fichiers ===== */
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const GROUPS = {'DEF':'def','RUCK OFF':'ro','RUCK DEF':'rd','DISCIPLINES':'disc','DISCIPLINE':'disc','ATTAQUE':'att','ATTAQUE DUEL CONTACT':'dc','ATTAQUE DUEL ESPACE':'de','SPE':'spe','SPECIFIQUE':'spe','SCORING':'score'};
const groupKey = name => GROUPS[norm(name).replace(/^\d+\s*\.?\s*/,'')] || null;

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]; const delim=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  const head=rows.shift().map(x=>x.trim());
  const iRow=head.findIndex(x=>norm(x)==='ROW'), iT=head.findIndex(x=>norm(x)==='START TIME');
  if(iRow<0||iT<0) throw new Error('Colonnes « Row » et « Start time » introuvables dans le CSV.');
  const gIdx=head.map(groupKey);
  return rows.filter(r=>r.length>1&&r[iRow]).map(r=>{
    const o={player:r[iRow].trim(), t:parseFloat(String(r[iT]).replace(',','.'))||0, g:{}};
    gIdx.forEach((k,i)=>{ if(k&&r[i]&&r[i].trim()) o.g[k]=(o.g[k]?o.g[k]+', ':'')+r[i].trim(); });
    return o;
  });
}
function parseXML(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('Le fichier XML est illisible.');
  const inst=[...doc.getElementsByTagName('instance')];
  if(!inst.length) throw new Error('Aucune balise <instance> trouvée dans le XML.');
  const kid=(el,tag)=>{const c=[...el.children].find(x=>x.tagName.toLowerCase()===tag);return c?c.textContent.trim():'';};
  return inst.map(el=>{
    const o={player:kid(el,'code'), t:parseFloat(kid(el,'start'))||0, g:{}};
    [...el.children].filter(x=>x.tagName.toLowerCase()==='label').forEach(lb=>{
      const k=groupKey(kid(lb,'group')); const tx=kid(lb,'text');
      if(k&&tx) o.g[k]=(o.g[k]?o.g[k]+', ':'')+tx;
    });
    return o;
  }).filter(o=>o.player);
}

/* ===== Calcul des stats ===== */
const titleName = s => s.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function compute(rows){
  const M=new Map(), ev=[];
  const add=(p,k,n=1)=>{p[k]=(p[k]||0)+n;};
  for(const r of rows){
    const name=titleName(r.player.trim());
    if(!M.has(name)) M.set(name,{name});
    const p=M.get(name); add(p,'actions'); const t=Math.round(r.t/60*100)/100; const g=r.g;
    if(g.def||g.ro||g.rd||g.att||g.dc||g.de||g.spe) add(p,'taches');
    const toks = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
    if(g.def){ const T=toks(g.def), N=T.map(norm);
      if(N.some(x=>x.startsWith('PLAQUAGE'))){ const miss=N.some(x=>x==='RATE'||x==='MANQUE');
        if(miss){add(p,'plaq_rate');ev.push([t,'def','Plaq. manqué',0,name]);}
        else{add(p,'plaq_ok'); if(N.includes('+'))add(p,'plaq_dom'); if(N.includes('-'))add(p,'plaq_subi'); ev.push([t,'def','Plaquage',1,name]);} }
      else if(N.includes('ASSISTANT')){ const ok=!N.includes('-'); add(p,ok?'ast_pos':'ast_neg'); ev.push([t,'def','Assistant',ok?1:0,name]); }
      N.filter(x=>x.replace(/\.$/,'')==='BALLON RECUP'||x==='BALLON RECUPERE').forEach(()=>{add(p,'recup');ev.push([t,'def','Ballon récupéré',1,name]);}); }
    if(g.ro){ const N=toks(g.ro).map(norm); const neg=N.includes('-');
      add(p,'ro'); add(p,neg?'ro_neg':'ro_pos');
      const role=N.find(x=>['ANCREUR','RASEUR','LATCHEUR'].includes(x)); if(role) add(p,'ro_'+role.toLowerCase());
      if(N.includes('1')) add(p,'ro_1er'); else if(N.includes('2')) add(p,'ro_r2'); else if(N.includes('3')) add(p,'ro_r3'); else if(N.some(x=>x==='4+'||x==='4')) add(p,'ro_r4'); ev.push([t,'ruck','Ruck off.',neg?0:1,name]); }
    if(g.rd){ const N=toks(g.rd).map(norm); const ok=N.includes('+'); const contre=N.some(x=>x.includes('CONTRE'));
      add(p,'rd'); add(p,ok?'rd_pos':'rd_neg');
      if(contre){add(p,'contre'); if(ok)add(p,'contre_pos');} else {add(p,'gratt'); if(ok)add(p,'gratt_pos');}
      ev.push([t,'ruck',contre?'Contre-ruck':'Grattage',ok?1:0,name]); }
    if(g.disc){ const N=toks(g.disc).map(norm); add(p,'faute'); const cj=N.includes('CJ'), cr=N.includes('CR'), cb=N.includes('CB'); if(cj)add(p,'cj'); if(cr)add(p,'cr'); if(cb)add(p,'cb');
      ev.push([t,'disc',cr?'Carton rouge':cj?'Carton jaune':cb?'Carton blanc':'Faute',0,name]); }
    if(g.att){ for(const x of toks(g.att).map(norm)){
      const m={'PASSE +':'passe_pos','PASSE -':'passe_neg','PDB':'pdb','DEF BATTU':'defbattu','OFFLOAD +':'off_pos','OFFLOAD -':'off_neg','FRANCHISSEMENT':'franch'}[x];
      if(!m) continue; add(p,m);
      if(m==='pdb') ev.push([t,'att','Perte de balle',0,name]);
      else if(m==='defbattu'||m==='franch') ev.push([t,'att','Déf. battu / franch.',1,name]);
      else ev.push([t,'att',m.startsWith('off')?'Offload':'Passe',m.endsWith('neg')?0:1,name]); } }
    if(g.dc){ const N=toks(g.dc); const ok=N.includes('+'); if(ok||N.includes('-')){ add(p,ok?'duel_pos':'duel_neg'); ev.push([t,'att','Duel contact',ok?1:0,name]); } }
    if(g.de){ const N=toks(g.de); if(N.includes('+')){add(p,'espace_pos'); ev.push([t,'att','Déf. battu / franch.',1,name]);} else if(N.includes('-')) add(p,'espace_neg'); }
    if(g.spe){ for(const x of toks(g.spe).map(norm)){
      const mm=x.match(/^(.*?)\s*([+-])$/); if(!mm) continue; const kind=mm[1].trim(), ok=mm[2]==='+';
      const k={'MELEE':'melee','JAP':'jap','AERIEN':'aerien','SAUTEUR OFF':'tOFF','SAUTEUR DEF':'tDEF','LANCEUR':'lanceur'}[kind]; if(!k) continue;
      add(p,k+(ok?'_pos':'_neg'));
      const lab=k==='melee'?'Mêlée':k==='jap'?'Jeu au pied':k==='aerien'?'Aérien':'Touche';
      ev.push([t,'disc',lab,ok?1:0,name]); } }
    if(g.score){ for(const x of toks(g.score).map(norm)){
      if(x==='ESSAI'){add(p,'essai');ev.push([t,'disc','Essai',1,name]);}
      else if(x==='TRANSFO +'){add(p,'transfo');ev.push([t,'disc','Transformation',1,name]);}
      else if(x==='PENALITE +'){add(p,'pen');ev.push([t,'disc','Pénalité',1,name]);}
      else if(x==='DROP +'){add(p,'drop');ev.push([t,'disc','Drop',1,name]);}
      else if(x==='TRANSFO -') add(p,'transfo_neg'); else if(x==='PENALITE -') add(p,'pen_neg'); else if(x==='DROP -') add(p,'drop_neg'); } }
  }
  const players=[...M.values()]; players.forEach(p=>{p.pts=5*(p.essai||0)+2*(p.transfo||0)+3*(p.pen||0)+3*(p.drop||0);});
  // mi-temps : plus grand trou entre 25 % et 75 % du temps vidéo
  const ts=rows.map(r=>r.t/60).sort((a,b)=>a-b); const tmax=Math.max(10,Math.ceil((ts[ts.length-1]||80)/10)*10);
  let ht=null, best=4;
  for(let i=1;i<ts.length;i++){ const gap=ts[i]-ts[i-1], mid=(ts[i]+ts[i-1])/2; if(gap>best && mid>tmax*.25 && mid<tmax*.75){best=gap;ht=[Math.round(ts[i-1]*10)/10,Math.round(ts[i]*10)/10];} }
  return {players, events:ev, ht, tmax, nbRows:rows.length};
}

function clubOf(adv){
  const n=norm(adv).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  if(!n) return null;
  return CLUBS.find(c=>c.alias.some(x=>n===x))||CLUBS.find(c=>c.alias.some(x=>x.length>3&&n.includes(x)))||{key:slug(adv),nom:adv,alias:[]};
}

function shrinkImage(file,max=220){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'));};img.onerror=()=>rej(new Error('Image illisible.'));img.src=fr.result;};fr.onerror=()=>rej(new Error('Fichier illisible.'));fr.readAsDataURL(file);});}

let ROSTER=[], RMAP={};
const POSTES={1:'Pilier gauche',2:'Talonneur',3:'Pilier droit',4:'2e ligne',5:'2e ligne',6:'3e ligne aile',7:'3e ligne aile',8:'Numéro 8',9:'Demi de mêlée',10:'Demi d’ouverture',11:'Ailier',12:'Centre',13:'Centre',14:'Ailier',15:'Arrière'};
const nkey=s=>norm(s).replace(/[^A-Z]/g,'');
function lev(a,b){ const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n); let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function setRoster(list){ ROSTER=(list||[]).map(r=>({...r})); RMAP={}; ROSTER.forEach(r=>{ r.display=titleName(r.nom); RMAP[nkey(r.nom)]=r; }); CANON_CACHE={}; }
let CANON_CACHE={};
function rosterOf(name){
  if(name in CANON_CACHE) return CANON_CACHE[name];
  const k=nkey(name); let r=RMAP[k]||null;
  if(!r&&k.length>3){ let best=null,bd=99; for(const kk in RMAP){ const d=lev(k,kk); if(d<bd){bd=d;best=kk;} } if(best&&bd<=2&&bd/Math.max(k.length,best.length)<=0.2) r=RMAP[best]; }
  return CANON_CACHE[name]=r;
}
const canon=name=>{ const r=rosterOf(name); return r?r.display:name; };
const mapPlayers=ps=>{ const M=new Map(); for(const p of ps){ const n=canon(p.name); if(!M.has(n)) M.set(n,{...p,name:n}); else { const a=M.get(n); for(const k in p) if(k!=='name'&&typeof p[k]==='number') a[k]=(a[k]||0)+p[k]; } } return [...M.values()]; };
function badge(name){ const r=rosterOf(name); return r&&r.poste?`<span class="pbadge" title="${h(POSTES[r.poste]||'')}">${r.poste}</span>`:'<span class="pbadge empty"></span>'; }
const posteOf=name=>{ const r=rosterOf(name); return r?r.poste:null; };
const anneeOf=name=>{ const r=rosterOf(name); return r?r.annee:null; };

function bindTables(root){
  root.querySelectorAll('table').forEach(t=>{
    const ths=t.querySelectorAll('th');
    const sortBy=i=>{const th=ths[i]; const asc=th.classList.contains('on')?!th.classList.contains('asc'):i===0;
      ths.forEach(x=>x.classList.remove('on','asc')); th.classList.add('on'); if(asc) th.classList.add('asc');
      const rows=[...t.tBodies[0].rows];
      rows.sort((a,b)=>{const x=a.cells[i].dataset.v,y=b.cells[i].dataset.v,nx=parseFloat(x),ny=parseFloat(y);
        const c=(!isNaN(nx)&&!isNaN(ny))?nx-ny:x.localeCompare(y,'fr'); return asc?c:-c;});
      rows.forEach(r=>t.tBodies[0].appendChild(r));};
    ths.forEach((th,i)=>{th.addEventListener('click',()=>sortBy(i));th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sortBy(i);}});});
  });
}

const SEASON_ID='__saison';

const jnum=m=>parseInt(String(m.journee||'').replace(/\D/g,''))||0;
function teamStats(players){
  const s=k=>players.reduce((t,p)=>t+(p[k]||0),0);
  const r=(a,b)=>b?Math.round(100*a/b):null;
  return {
    plaq:r(s('plaq_ok'),s('plaq_ok')+s('plaq_rate')), miss:s('plaq_rate'), recup:s('recup'),
    duel:r(s('duel_pos'),s('duel_pos')+s('duel_neg')), pdb:s('pdb'), db:s('defbattu'),
    ruck:r(s('ro_pos'),s('ro')), gratt:r(s('gratt_pos'),s('gratt')), fautes:s('faute'), cartons:s('cj')+s('cr')+s('cb'),
    melee:r(s('melee_pos'),s('melee_pos')+s('melee_neg')), lancer:r(s('lanceur_pos'),s('lanceur_pos')+s('lanceur_neg')), pts:s('pts')
  };
}
function seasonData(list){
  const M=new Map(); const ev=[];
  for(const m of list){
    const d=m.data, split=d.ht?(d.ht[0]+d.ht[1])/2:d.tmax/2;
    for(const p of mapPlayers(d.players)){
      if(!M.has(p.name)) M.set(p.name,{name:p.name,mj:0});
      const a=M.get(p.name); a.mj++;
      for(const k in p) if(k!=='name'&&typeof p[k]==='number') a[k]=(a[k]||0)+p[k];
    }
    // temps ramenés sur 90' (mi-temps à 45') pour les répartitions par période
    for(const e of d.events){ const t=e[0]<split? e[0]*45/split : 45+(e[0]-split)*45/Math.max(1,d.tmax-split); ev.push([Math.round(t*10)/10,e[1],e[2],e[3],e[4]]); }
  }
  return {players:[...M.values()], events:ev};
}
function evoChart(list){
  const series=[['Plaquages','plaq','var(--b1)'],['Duels contact','duel','var(--nissa)'],['Rucks off.','ruck','var(--b2)'],['Lancers','lancer','var(--b3)']];
  const st=list.map(m=>teamStats(m.data.players));
  const W=640,H=230,L=60,R=60,T=16,B=36, n=list.length;
  const x=i=>n<2?(L+W-R)/2:L+(W-L-R)*i/(n-1), y=v=>T+(H-T-B)*(100-v)/50;
  let g='';
  for(let v=50;v<=100;v+=10){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v} %</text>`; }
  list.forEach((m,i)=>{ g+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${h(m.journee||'')} ${h(m.adversaire||'')}</text>`; });
  series.forEach(([n_,k,c])=>{
    const pts=st.map((s,i)=>s[k]==null?null:[x(i),y(Math.max(50,s[k])),s[k]]).filter(Boolean);
    if(pts.length>1) g+=`<polyline points="${pts.map(p=>p[0]+','+p[1]).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${c}" stroke="var(--card)" stroke-width="1.5"><title>${n_} : ${p[2]} %</title></circle>`; });
  });
  const lg=series.map(([n_,,c])=>`<span><i style="background:${c}"></i>${n_}</span>`).join('');
  return `<div class="card"><h3>Évolution des taux de réussite</h3><p class="sub">Par match, en % (échelle de 50 à 100 %).</p><div class="legend">${lg}</div><div class="tl"><svg viewBox="0 0 ${W} ${H}" style="min-width:420px" role="img" aria-label="Évolution des taux de réussite par match">${g}</svg></div></div>`;
}
function evoTable(list){
  const cols=[['Plaquages','plaq','%',90,80,true],['Plaq. manqués','miss','',8,12,false],['Ballons récup.','recup','',null],['Duels contact','duel','%',75,65,true],['Déf. battus','db','',null],['Pertes de balle','pdb','',10,15,false],['Rucks off.','ruck','%',92,85,true],['Grattages','gratt','%',50,30,true],['Fautes','fautes','',8,11,false],['Cartons','cartons','',0,1,false],['Mêlée','melee','%',60,50,true],['Lancers','lancer','%',85,75,true],['Points','pts','',null]];
