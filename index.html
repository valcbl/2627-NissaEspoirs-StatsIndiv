/* ===== Verrou de la fiche comparaison ===== */
let OWNER=false, CMP_HASH='4efa55a937fda0381efd11101e83fde30db8d77305f382d42ffa2f1631c373c5', CMP_CFG_LOADED=true, CMP_OK=false;
async function hashCode(code){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nissa-cmp:'+code.trim())); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function cmpUnlocked(){ return CMP_OK; }
function renderLock(view=COMPARE_ID){
  const LBL=view===MIN_ID?['Temps de jeu & tâches','consulter le temps de jeu et les tâches']:['Comparaison de joueurs','comparer deux joueurs'];
  const el=document.getElementById('report');
  el.innerHTML=`<header class="mast"><img src="data:image/png;base64,${LOGO}" alt="Nissa Rugby"><div class="t"><div class="eyebrow">Nissa Rugby · Staff · ${LBL[0]}</div><h1>Fiche réservée</h1><div class="meta">Entre le mot de passe pour ${LBL[1]}.</div></div></header>
  <div class="card lock">${!CMP_CFG_LOADED&&DB?'<p class="sub">Chargement…</p>':CMP_HASH?`<form id="lockForm" class="lockform"><label for="lockCode">Mot de passe<input type="password" id="lockCode" autocomplete="off" inputmode="text" required></label><button type="submit">Déverrouiller</button></form><p class="msg" id="lockMsg" aria-live="polite"></p>`:'<p class="sub">L’accès à cette fiche n’a pas encore été ouvert. Demande le code au staff.</p>'}</div>`;
  const f=document.getElementById('lockForm'); if(!f) return;
  document.getElementById('lockCode').focus();
  f.addEventListener('submit',async e=>{ e.preventDefault(); const h=await hashCode(document.getElementById('lockCode').value);
    if(h===CMP_HASH){ CMP_OK=true; view===MIN_ID?renderMinutes():renderCompare(); }
    else { const m=document.getElementById('lockMsg'); m.className='msg err'; m.textContent='Mot de passe incorrect.'; document.getElementById('lockCode').select(); } });
}
function ownerCodeBox(){
  if(!OWNER||!DB) return '';
  return `<div class="card no-print codebox"><form id="codeForm" class="lockform"><label for="newCode">Code d’accès à la fiche ${CMP_HASH?'(un code est actif)':'(aucun code défini)'}<input type="text" id="newCode" autocomplete="off" placeholder="Nouveau code" required minlength="4"></label><button type="submit">${CMP_HASH?'Changer le code':'Définir le code'}</button></form><p class="sub" style="margin:8px 0 0">Toi seul vois ce réglage. Changer le code reverrouille la fiche pour tout le monde.</p><p class="msg" id="codeMsg" aria-live="polite"></p></div>`;
}
function bindOwnerCodeBox(){
  const f=document.getElementById('codeForm'); if(!f) return;
  f.addEventListener('submit',async e=>{ e.preventDefault(); const v=document.getElementById('newCode').value; const m=document.getElementById('codeMsg');
    if(v.trim().length<4){ m.className='msg err'; m.textContent='4 caractères minimum.'; return; }
    try{ const h=await hashCode(v); await DB.doc('config/comparaison').set({hash:h}); CMP_HASH=h; m.className='msg ok'; m.textContent='Code enregistré. Communique-le aux personnes autorisées.'; document.getElementById('newCode').value=''; }
    catch(err){ m.className='msg err'; m.textContent='Enregistrement impossible, réessaie.'; } });
}

/* ===== Comparaison de deux joueurs ===== */
const COMPARE_ID='__compare';
let CMP=(()=>{try{return JSON.parse(localStorage.getItem('cmp'))||{};}catch(e){return {};}})();
const CMP_STATS=[
 ['Défense',[
  ['Plaquages réussis',p=>v(p,'plaq_ok')],
  ['% réussite plaquage',p=>pct(v(p,'plaq_ok'),v(p,'plaq_ok')+v(p,'plaq_rate')),'%'],
  ['Plaquages dominants',p=>v(p,'plaq_dom')],
  ['Plaquages manqués',p=>v(p,'plaq_rate'),'',1],
  ['Assistants réussis',p=>v(p,'ast_pos')],
  ['Ballons récupérés',p=>v(p,'recup')]]],
 ['Attaque',[
  ['Duels contact gagnés',p=>v(p,'duel_pos')],
  ['% duels gagnés',p=>pct(v(p,'duel_pos'),v(p,'duel_pos')+v(p,'duel_neg')),'%'],
  ['Défenseurs battus',p=>v(p,'defbattu')],
  ['Franchissements',p=>v(p,'franch')],
  ['Passes réussies',p=>v(p,'passe_pos')],
  ['Offloads réussis',p=>v(p,'off_pos')],
  ['Pertes de balle',p=>v(p,'pdb'),'',1]]],
 ['Ruck offensif',[
  ['Rucks offensifs',p=>v(p,'ro')],
  ['% efficacité ruck',p=>pct(v(p,'ro_pos'),v(p,'ro')),'%'],
  ['1er arrivé',p=>v(p,'ro_1er')],
  ['Rucks ratés',p=>v(p,'ro_neg'),'',1]]],
 ['Ruck défensif',[
  ['Grattages réussis',p=>v(p,'gratt_pos')],
  ['% grattage',p=>pct(v(p,'gratt_pos'),v(p,'gratt')),'%'],
  ['Contres-rucks réussis',p=>v(p,'contre_pos')],
  ['Échecs au sol',p=>v(p,'rd_neg'),'',1]]],
 ['Discipline',[
  ['Fautes',p=>v(p,'faute'),'',1],
  ['Cartons',p=>v(p,'cj')+v(p,'cr')+v(p,'cb'),'',1]]],
 ['Spécifique',[
  ['Mêlées positives',p=>v(p,'melee_pos')],
  ['Lancers réussis',p=>v(p,'lanceur_pos')],
  ['Sauts gagnés',p=>v(p,'tOFF_pos')+v(p,'tDEF_pos')],
  ['Jeu au pied réussi',p=>v(p,'jap_pos')],
  ['Ballons aériens gagnés',p=>v(p,'aerien_pos')],
  ['Points marqués',p=>v(p,'pts')]]],
];
function renderCompare(){
  if(!cmpUnlocked()){ renderLock(); window.__report={id:COMPARE_ID,season:true,ajoute:'lock'}; return; }
  const el=document.getElementById('report');
  const list=[...MATCHES].sort((a,b)=>jnum(a)-jnum(b));
  if(!list.length){ renderReport(null); return; }
  const all=seasonData(list).players.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  const names=all.map(p=>p.name);
  const byAct=[...all].sort((a,b)=>b.actions-a.actions);
  if(!names.includes(CMP.a)) CMP.a=byAct[0]?.name;
  if(!names.includes(CMP.b)||CMP.b===CMP.a) CMP.b=byAct.find(p=>p.name!==CMP.a)?.name;
  if(CMP.scope!=='saison'&&!list.find(m=>m.id===CMP.scope)) CMP.scope='saison';
  if(!CMP.mode) CMP.mode='avg';
  const season=CMP.scope==='saison';
  const pool=season?all:mapPlayers(list.find(m=>m.id===CMP.scope).data.players).map(p=>({...p,mj:1}));
  const A=pool.find(p=>p.name===CMP.a), B=pool.find(p=>p.name===CMP.b);
  const avg=season&&CMP.mode==='avg';
  const val=(p,f,unit)=>{ if(!p) return null; const x=f(p); if(x==null) return null; return unit==='%'||!avg?x:Math.round(x/p.mj*10)/10; };
  const fmt=(x,unit)=>x==null?'–':(unit==='%'?x+' %':String(x).replace('.',','));
  let winA=0,winB=0;
  const groups=CMP_STATS.map(([g,stats])=>{
    const rows=stats.map(([lab,f,unit,low])=>{
      const a=val(A,f,unit), b=val(B,f,unit);
      if(!a&&!b) return '';
      const max=Math.max(a||0,b||0)||1;
      let w=0; if(a!=null&&b!=null&&a!==b){ w=(low?a<b:a>b)?1:2; } else if(a!=null&&b==null) w=1; else if(b!=null&&a==null) w=2;
      if(w===1) winA++; if(w===2) winB++;
      return `<div class="cmp-row"><span class="va ${w===1?'win':''}">${fmt(a,unit)}</span><span class="ba"><i style="width:${100*(a||0)/max}%"></i></span><span class="lab">${lab}${low?' <em>(moins = mieux)</em>':''}</span><span class="bb"><i style="width:${100*(b||0)/max}%"></i></span><span class="vb ${w===2?'win':''}">${fmt(b,unit)}</span></div>`;
    }).join('');
    return rows?`<div class="cmp-group"><h4>${g}</h4>${rows}</div>`:'';
  }).join('');
  const opt=(sel)=>names.map(n=>`<option value="${h(n)}"${n===sel?' selected':''}>${h(n)}${posteOf(n)?' ('+posteOf(n)+')':''}</option>`).join('');
  const scopeOpts=`<option value="saison"${season?' selected':''}>Saison (${list.length} matchs)</option>`+[...list].reverse().map(m=>`<option value="${h(m.id)}"${m.id===CMP.scope?' selected':''}>${h(label(m))}</option>`).join('');
  const who=(p,n)=>p?`${h(n)} <small>${season?`${p.mj} match${p.mj>1?'s':''} · `:''}${p.actions} actions</small>`:`${h(n)} <small>n’a pas d’action codée sur ce périmètre</small>`;
  const scopeTxt=season?`Saison 2026-2027 · ${avg?'moyennes par match':'totaux'}`:label(list.find(m=>m.id===CMP.scope));
  el.innerHTML=`<header class="mast"><img src="data:image/png;base64,${LOGO}" alt="Nissa Rugby"><div class="t"><div class="eyebrow">Nissa Rugby · Staff · Comparaison de joueurs</div><h1>${h(CMP.a)} <span>vs</span> ${h(CMP.b)}</h1><div class="meta">${h(scopeTxt)}</div></div></header>
  <div class="card cmp-ctl no-print">
    <label for="cmpA">Joueur A<select id="cmpA">${opt(CMP.a)}</select></label>
    <label for="cmpB">Joueur B<select id="cmpB">${opt(CMP.b)}</select></label>
    <label for="cmpScope">Périmètre<select id="cmpScope">${scopeOpts}</select></label>
    <label for="cmpMode">Affichage<select id="cmpMode"${season?'':' disabled'}><option value="avg"${CMP.mode==='avg'?' selected':''}>Moyenne par match</option><option value="tot"${CMP.mode==='tot'?' selected':''}>Total</option></select></label>
  </div>
  <div class="card cmp">
    <div class="cmp-head"><div class="pa">${who(A,CMP.a)}</div><div class="score"><b>${winA}</b><span>stats en tête</span><b>${winB}</b></div><div class="pb">${who(B,CMP.b)}</div></div>
    ${groups||'<p class="sub">Aucune action codée pour ces deux joueurs sur ce périmètre.</p>'}
    <p class="sub" style="margin-top:12px">Les pourcentages ne sont pas moyennés : ils portent sur toutes les actions du périmètre. Chaque ligne a sa propre échelle ; la valeur en gras est la meilleure des deux.</p>
  </div>`;
  const save=()=>{try{localStorage.setItem('cmp',JSON.stringify(CMP));}catch(e){} renderCompare();};
  $('cmpA').addEventListener('change',e=>{CMP.a=e.target.value; if(CMP.b===CMP.a) CMP.b=byAct.find(p=>p.name!==CMP.a)?.name; save();});
  $('cmpB').addEventListener('change',e=>{CMP.b=e.target.value; save();});
  $('cmpScope').addEventListener('change',e=>{CMP.scope=e.target.value; save();});
  $('cmpMode').addEventListener('change',e=>{CMP.mode=e.target.value; save();});
  window.__report={id:COMPARE_ID,season:true,ajoute:list.map(m=>m.ajoute).join('|')};
}

/* ===== Temps de jeu & tâches ===== */
const MIN_ID='__minutes';
const MIN_COLS=[...Array.from({length:18},(_,i)=>'J'+(i+1)),'QF','DF','F'];
const MIN_LAB=c=>({QF:'1/4',DF:'1/2',F:'Finale'}[c]||c);
const CAL={J1:'Vienne',J2:'Bourg',J3:'Bourgoin',J4:'Chambéry',J5:'Narbonne',J6:'Carcassonne',J7:'Béziers',J8:'Albi',J9:'Provence',J10:'Vienne',J11:'Bourg',J12:'Bourgoin',J13:'Chambéry',J14:'Narbonne',J15:'Carcassonne',J16:'Béziers',J17:'Albi'};
let MIN={}, MIN_LOADED=false, minTimer=null;
function colOf(m){ const j=norm(m.journee||''); const n=j.match(/^J\s*0*(\d{1,2})$/); if(n) return 'J'+(+n[1]);
  if(/QUART|1\/4/.test(j)) return 'QF'; if(/DEMI|1\/2/.test(j)) return 'DF'; if(/FINAL/.test(j)) return 'F'; return null; }
const minTot=n=>Object.values(MIN[n]||{}).reduce((s,x)=>s+(+x||0),0);
const minCoded=n=>{ const cs=new Set(MATCHES.map(colOf).filter(Boolean)); return Object.entries(MIN[n]||{}).reduce((s,[c,x])=>s+(cs.has(c)?(+x||0):0),0); };
const minMatchs=n=>Object.values(MIN[n]||{}).filter(x=>+x>0).length;
function tachesByPlayer(){ const T={}; for(const m of MATCHES){ const c=colOf(m); if(!c) continue; for(const p of mapPlayers(m.data.players)){ (T[p.name]=T[p.name]||{})[c]=(T[p.name][c]||0)+(p.taches||0); } } return T; }
function saveMinutes(){ clearTimeout(minTimer); const st=$('minState'); if(st) st.textContent='Enregistrement…';
  minTimer=setTimeout(async()=>{ try{ if(DB) await DB.doc('temps/saison').set({minutes:MIN}); if(st) st.textContent='Enregistré.'; }catch(e){ if(st){ st.className='msg err'; st.textContent='Enregistrement impossible, réessaie.'; } } },600); }
function renderMinutes(){
  if(!CMP_OK){ renderLock(MIN_ID); window.__report={id:MIN_ID,season:true,ajoute:'lock'}; return; }
  const el=document.getElementById('report');
  const T=tachesByPlayer(); const played=new Set(MATCHES.map(colOf).filter(Boolean));
  const names=[...new Set([...ROSTER.map(r=>r.display),...Object.keys(T),...Object.keys(MIN).map(canon)])].sort((a,b)=>(posteOf(a)||99)-(posteOf(b)||99)||a.localeCompare(b,'fr'));
  Object.keys(MIN).forEach(k=>{ const c=canon(k); if(c!==k){ MIN[c]=Object.assign({},MIN[k],MIN[c]||{}); delete MIN[k]; } });
  const edit=!!(DB&&canWrite);
  const head=`<tr><th>Joueur</th><th>Né en</th>${MIN_COLS.map(c=>`<th class="${played.has(c)?'played':''}">${MIN_LAB(c)}${CAL[c]?`<small>${CAL[c]}</small>`:''}</th>`).join('')}`;
  const minRows=names.map(n=>`<tr><td>${badge(n)}${h(n)}${edit&&rosterOf(n)?`<button type="button" class="rm no-print" data-n="${h(n)}" title="Retirer ${h(n)} de l’effectif" aria-label="Retirer ${h(n)} de l’effectif">×</button>`:''}</td><td class="d">${anneeOf(n)||'–'}</td>${MIN_COLS.map(c=>{const val=(MIN[n]||{})[c]; return edit?`<td class="mi"><input type="number" min="0" max="120" inputmode="numeric" data-p="${h(n)}" data-c="${c}" value="${val??''}" aria-label="${h(n)} ${MIN_LAB(c)}"></td>`:`<td class="${val?'':'d'}">${val||'–'}</td>`;}).join('')}<td class="pct">${minTot(n)||'–'}</td><td>${minMatchs(n)||'–'}</td></tr>`).join('');
  const tRows=names.filter(n=>T[n]).map(n=>{const tot=Object.values(T[n]).reduce((s,x)=>s+x,0), nm=Object.keys(T[n]).length, mt=minCoded(n);
    return `<tr><td>${badge(n)}${h(n)}</td><td class="d">${anneeOf(n)||'–'}</td>${MIN_COLS.map(c=>`<td class="${T[n][c]?'':'d'}">${T[n][c]??'–'}</td>`).join('')}<td class="pct">${tot}</td><td>${(Math.round(tot/nm*10)/10).toString().replace('.',',')}</td><td class="pct">${mt?(Math.round(tot/mt*100)/100).toFixed(2).replace('.',','):'–'}</td></tr>`;}).join('');
  const teamCol=c=>Object.values(T).reduce((s,x)=>s+(x[c]||0),0);
  const teamTot=MIN_COLS.reduce((s,c)=>s+teamCol(c),0);
  el.innerHTML=`<header class="mast"><img src="data:image/png;base64,${LOGO}" alt="Nissa Rugby"><div class="t"><div class="eyebrow">Nissa Rugby · Staff · Espoirs Accession</div><h1>Temps de jeu & tâches</h1><div class="meta">Saison 2026-2027 · J1 à J18 et phases finales</div></div></header>
  <section class="sector" id="minutes"><div class="sec-title"><h2><svg class="hex" viewBox="0 0 16 18" aria-hidden="true"><polygon points="8,0 16,3.2 14.7,14 8,18 1.3,14 0,3.2" fill="var(--nissa)"/></svg>Minutes jouées</h2><span>${edit?'Saisie manuelle · enregistrement automatique':'Saisi par le staff'}</span></div>
  <div class="card"><div class="tw"><table class="mtab"><thead>${head}<th>Total</th><th>Matchs</th></tr></thead><tbody>${minRows||`<tr><td colspan="${MIN_COLS.length+4}" class="d">Aucun joueur pour l’instant.</td></tr>`}</tbody></table></div>
  ${edit?`<form id="addP" class="addp no-print"><h4>Ajouter un joueur à l’effectif</h4><div class="addp-f"><label for="apNom">Nom<input type="text" id="apNom" required></label><label for="apPre">Prénom<input type="text" id="apPre"></label><label for="apAn">Né en<input type="number" id="apAn" min="1990" max="2015" inputmode="numeric"></label><label for="apPo">Poste<select id="apPo"><option value="">–</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option></select></label><button type="submit">Ajouter</button></div><span class="msg" id="minState" aria-live="polite"></span></form>`:''}</div></section>
  ${proSection(edit)}
  <section class="sector" id="taches"><div class="sec-title"><h2><svg class="hex" viewBox="0 0 16 18" aria-hidden="true"><polygon points="8,0 16,3.2 14.7,14 8,18 1.3,14 0,3.2" fill="var(--nissa)"/></svg>Tâches par match</h2><span>Calculées automatiquement à partir des matchs importés</span></div>
  <div class="card"><p class="sub">Une tâche = une action codée en défense, ruck, attaque ou phase spécifique (fautes et points non comptés). Tâches/min = tâches divisées par les minutes jouées sur les matchs importés (un match sans fichier de codage n’est pas compté).</p><div class="tw"><table class="mtab"><thead>${head}<th>Total</th><th>Moy./match</th><th>Tâches/min</th></tr></thead><tbody>${tRows}<tr style="border-top:2px solid var(--ink)"><td><b>Équipe</b></td><td></td>${MIN_COLS.map(c=>`<td class="pct ${teamCol(c)?'':'d'}">${teamCol(c)||'–'}</td>`).join('')}<td class="pct">${teamTot}</td><td>${played.size?Math.round(teamTot/played.size):'–'}</td><td></td></tr></tbody></table></div></div></section>`;
  if(edit){
    bindPro(el);
    el.querySelectorAll('.mtab input[data-p]').forEach(inp=>inp.addEventListener('change',()=>{ const p=inp.dataset.p, c=inp.dataset.c; let x=inp.value===''?null:Math.max(0,Math.min(120,Math.round(+inp.value))); MIN[p]=MIN[p]||{}; if(x==null) delete MIN[p][c]; else MIN[p][c]=x; inp.value=x??''; saveMinutes();
      const tr=inp.closest('tr'); tr.cells[MIN_COLS.length+2].textContent=minTot(p)||'–'; tr.cells[MIN_COLS.length+3].textContent=minMatchs(p)||'–'; }));
    el.querySelectorAll('.mtab .rm[data-n]').forEach(btn=>btn.addEventListener('click',async()=>{
      if(!btn.classList.contains('armed')){ el.querySelectorAll('.mtab .rm.armed').forEach(b=>{b.classList.remove('armed');b.textContent='×';}); btn.classList.add('armed'); btn.textContent='Retirer ?'; setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('armed'); btn.textContent='×'; } },4000); return; }
      const n=btn.dataset.n, r=rosterOf(n); if(!r) return;
      const list=ROSTER.filter(x=>x!==r).map(({display,...x})=>x);
      try{ await DB.doc('effectif/saison').set({joueurs:list}); setRoster(list); if(MIN[n]){ delete MIN[n]; saveMinutes(); } renderMinutes(); const s2=$('minState'); if(s2){ s2.className='msg ok'; s2.textContent=n+' retiré de l’effectif.'; } }
      catch(err){ const s2=$('minState'); if(s2){ s2.className='msg err'; s2.textContent='Suppression impossible, réessaie.'; } } }));
    $('addP').addEventListener('submit',async e=>{ e.preventDefault(); const nom=$('apNom').value.trim().toUpperCase(); if(!nom) return; const st=$('minState');
      if(ROSTER.some(r=>nkey(r.nom)===nkey(nom))){ st.className='msg err'; st.textContent='Ce joueur est déjà dans l’effectif.'; return; }
      const j={nom,prenom:$('apPre').value.trim(),annee:+$('apAn').value||null,poste:+$('apPo').value||null};
      const list=[...ROSTER.map(({display,...r})=>r),j];
      try{ await DB.doc('effectif/saison').set({joueurs:list}); setRoster(list); renderMinutes(); const s2=$('minState'); if(s2){ s2.className='msg ok'; s2.textContent=titleName(nom)+' ajouté à l’effectif.'; } }
      catch(err){ st.className='msg err'; st.textContent='Ajout impossible, réessaie.'; } });
  }
  window.__report={id:MIN_ID,season:true,ajoute:'min'};
}


/* ===== Minutes PRO D2 (espoirs concernés) ===== */
const PRO_COLS=[...Array.from({length:30},(_,i)=>'J'+(i+1)),'BAR','DEMI','FIN'];
const PRO_LAB=c=>({BAR:'Barrage',DEMI:'1/2',FIN:'Finale'}[c]||c);
const PRO_CAL={"J1": ["Biarritz", "E", "27/08"], "J2": ["Béziers", "D", "04/09"], "J3": ["Brive", "E", "11/09"], "J4": ["Grenoble", "D", "18/09"], "J5": ["Dax", "E", "25/09"], "J6": ["Nevers", "D", "09/10"], "J7": ["Provence Rugby", "D", "16/10"], "J8": ["Agen", "E", "23/10"], "J9": ["Aurillac", "D", "30/10"], "J10": ["Narbonne", "E", "06/11"], "J11": ["Valence Romans", "D", "20/11"], "J12": ["Soyaux-Angoulême", "E", "27/11"], "J13": ["Colomiers", "D", "04/12"], "J14": ["Oyonnax", "D", "11/12"], "J15": ["Montauban", "E", "18/12"], "J16": ["Dax", "D", "08/01"], "J17": ["Nevers", "E", "15/01"], "J18": ["Brive", "D", "22/01"], "J19": ["Grenoble", "E", "29/01"], "J20": ["Agen", "D", "12/02"], "J21": ["Valence Romans", "E", "19/02"], "J22": ["Biarritz", "D", "26/02"], "J23": ["Béziers", "E", "05/03"], "J24": ["Montauban", "D", "26/03"], "J25": ["Oyonnax", "E", "02/04"], "J26": ["Soyaux-Angoulême", "D", "09/04"], "J27": ["Colomiers", "E", "16/04"], "J28": ["Provence Rugby", "E", "23/04"], "J29": ["Narbonne", "D", "07/05"], "J30": ["Aurillac", "E", "14/05"]};
let PRO={joueurs:[],minutes:{}}, proTimer=null;
const proTot=n=>Object.values(PRO.minutes[n]||{}).reduce((s,x)=>s+(+x||0),0);
const proApp=n=>Object.values(PRO.minutes[n]||{}).filter(x=>x!==null&&x!=='').length;
function savePro(){ clearTimeout(proTimer); const st=$('proState'); if(st){ st.className='msg'; st.textContent='Enregistrement…'; }
  proTimer=setTimeout(async()=>{ try{ if(DB) await DB.doc('temps/pro').set({joueurs:PRO.joueurs,minutes:PRO.minutes}); if(st){ st.className='msg ok'; st.textContent='Enregistré.'; } }catch(e){ if(st){ st.className='msg err'; st.textContent='Enregistrement impossible, réessaie.'; } } },600); }
function proSection(edit){
  const names=[...PRO.joueurs].map(canon).filter((v,i,a)=>a.indexOf(v)===i).sort((a,b)=>(posteOf(a)||99)-(posteOf(b)||99)||a.localeCompare(b,'fr'));
  const head=`<tr><th>Joueur</th>${PRO_COLS.map(c=>{const k=PRO_CAL[c]; return `<th class="${k?(k[1]==='D'?'dom':'ext'):''}">${PRO_LAB(c)}${k?`<small>${h(k[0].replace(' Rugby','').replace('Soyaux-Angoulême','Soyaux'))}</small><small>${k[1]==='D'?'Dom.':'Ext.'} ${k[2]}</small>`:''}</th>`;}).join('')}<th>Total Pro</th><th>Matchs Pro</th><th>Total Espoirs</th><th>Total saison</th></tr>`;
  const rows=names.map(n=>`<tr><td>${badge(n)}${h(n)}${edit?`<button type="button" class="rm no-print" data-pro="${h(n)}" title="Retirer ${h(n)} du tableau Pro" aria-label="Retirer ${h(n)} du tableau Pro">×</button>`:''}</td>${PRO_COLS.map(c=>{const v=(PRO.minutes[n]||{})[c]; return edit?`<td class="mi"><input type="number" min="0" max="120" inputmode="numeric" data-pp="${h(n)}" data-c="${c}" value="${v??''}" aria-label="${h(n)} Pro ${PRO_LAB(c)}"></td>`:`<td class="${v!=null?'':'d'}">${v??'–'}</td>`;}).join('')}<td class="pct">${proTot(n)||'–'}</td><td>${proApp(n)||'–'}</td><td>${minTot(n)||'–'}</td><td class="pct">${(proTot(n)+minTot(n))||'–'}</td></tr>`).join('');
  const avail=ROSTER.map(r=>r.display).filter(n=>!names.includes(n)).sort((a,b)=>a.localeCompare(b,'fr'));
  return `<section class="sector" id="minutes-pro"><div class="sec-title"><h2><svg class="hex" viewBox="0 0 16 18" aria-hidden="true"><polygon points="8,0 16,3.2 14.7,14 8,18 1.3,14 0,3.2" fill="var(--nissa)"/></svg>Minutes jouées en PRO D2</h2><span>Espoirs appelés en équipe première · calendrier 2026-2027</span></div>
  <div class="card"><p class="sub">Case vide = pas sur la feuille de match. 0 = entré sans jouer, compte comme une apparition.</p><div class="tw"><table class="mtab ptab"><thead>${head}</thead><tbody>${rows||`<tr><td colspan="${PRO_COLS.length+5}" class="d">Aucun espoir en PRO pour l’instant.</td></tr>`}</tbody></table></div>
  ${edit?`<form id="addPro" class="lockform no-print" style="margin-top:12px"><label for="proSel">Ajouter un espoir au tableau Pro<select id="proSel" required><option value="">Choisir un joueur</option>${avail.map(n=>`<option value="${h(n)}">${h(n)}${posteOf(n)?' ('+posteOf(n)+')':''}</option>`).join('')}</select></label><button type="submit">Ajouter</button><span class="msg" id="proState" aria-live="polite"></span></form>`:''}</div></section>`;
}
function bindPro(el){
  el.querySelectorAll('input[data-pp]').forEach(inp=>inp.addEventListener('change',()=>{ const p=inp.dataset.pp,c=inp.dataset.c; let x=inp.value===''?null:Math.max(0,Math.min(120,Math.round(+inp.value))); PRO.minutes[p]=PRO.minutes[p]||{}; if(x==null) delete PRO.minutes[p][c]; else PRO.minutes[p][c]=x; inp.value=x??''; savePro();
    const tr=inp.closest('tr'), L=PRO_COLS.length; tr.cells[L+1].textContent=proTot(p)||'–'; tr.cells[L+2].textContent=proApp(p)||'–'; tr.cells[L+4].textContent=(proTot(p)+minTot(p))||'–'; }));
  el.querySelectorAll('.rm[data-pro]').forEach(btn=>btn.addEventListener('click',()=>{
    if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent='Retirer ?'; setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('armed'); btn.textContent='×'; } },4000); return; }
    const n=btn.dataset.pro; PRO.joueurs=PRO.joueurs.filter(x=>canon(x)!==n); delete PRO.minutes[n]; savePro(); renderMinutes(); }));
  const f=$('addPro'); if(f) f.addEventListener('submit',e=>{ e.preventDefault(); const n=$('proSel').value; if(!n) return; if(!PRO.joueurs.includes(n)) PRO.joueurs.push(n); savePro(); renderMinutes(); });
}

/* ===== Matchs enregistrés ===== */
let DB=null, MATCHES=[], current=null, pending=null, canWrite=true;
const $=id=>document.getElementById(id);
const slug=s=>norm(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'match';
const label=m=>[m.journee,m.adversaire&&('vs '+m.adversaire),m.date].filter(Boolean).join(' · ')||m.source||m.id;
function fillSelect(){
  const s=$('matchSel');
  const ms=[...MATCHES].sort((a,b)=>jnum(b)-jnum(a));
  s.innerHTML=MATCHES.length?`<option value="${SEASON_ID}">Saison 2026-2027 · cumul</option><option value="${COMPARE_ID}">Comparer deux joueurs</option><option value="${MIN_ID}">Temps de jeu & tâches</option><optgroup label="Matchs">`+ms.map(m=>`<option value="${h(m.id)}">${h(label(m))}</option>`).join('')+'</optgroup>':'<option value="">Aucun match</option>';
  if(current) s.value=current;
  $('btnDelete').hidden=!(DB&&canWrite&&current&&current!==SEASON_ID&&current!==COMPARE_ID&&current!==MIN_ID);
}
function show(id){
  current=id; const m=MATCHES.find(x=>x.id===id);
  try{ localStorage.setItem('match',id||''); }catch(e){}
  fillSelect(); if(id===SEASON_ID) renderSeason(); else if(id===COMPARE_ID) renderCompare(); else if(id===MIN_ID) renderMinutes(); else renderReport(m||null);
  disarm();
}
function docToMatch(snap){ const d=snap.data(); try{ return {...d,id:snap.id,data:JSON.parse(d.payload)}; }catch(e){ return null; } }

$('matchSel').addEventListener('change',e=>show(e.target.value));
$('btnImport').addEventListener('click',()=>{ $('importPanel').hidden=!$('importPanel').hidden; });
$('btnCancel').addEventListener('click',()=>{ $('importPanel').hidden=true; resetImport(); });
function resetImport(){ pending=null; $('btnSave').disabled=true; $('dropLabel').textContent='Glisse ton fichier CSV ou XML ici'; $('msg').textContent=''; $('msg').className='msg'; $('file').value=''; }
const drop=$('drop');
drop.addEventListener('click',()=>$('file').click());
drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click();}});
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over'); if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);});
$('file').addEventListener('change',e=>{ if(e.target.files[0]) readFile(e.target.files[0]); });

function decodeBytes(u){
  // UTF-16 (exports Sportscode/Hudl), UTF-8, sinon Windows-1252 (CSV Excel)
  if(u[0]===0xFF&&u[1]===0xFE) return new TextDecoder('utf-16le').decode(u.subarray(2));
  if(u[0]===0xFE&&u[1]===0xFF) return new TextDecoder('utf-16be').decode(u.subarray(2));
  if(u.length>3&&u[0]===0x3C&&u[1]===0x00) return new TextDecoder('utf-16le').decode(u);
  if(u.length>3&&u[0]===0x00&&u[1]===0x3C) return new TextDecoder('utf-16be').decode(u);
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(u); }catch(e){ return new TextDecoder('windows-1252').decode(u); }
}
function readFile(file){
  const msg=$('msg'); msg.className='msg'; msg.textContent='Lecture…';
  const r=new FileReader();
  r.onload=()=>{
    try{
      const text=decodeBytes(new Uint8Array(r.result));
      const isXML=/\.xml$/i.test(file.name)||/^\s*<\?xml|^\s*<file/i.test(text);
      const rows=isXML?parseXML(text):parseCSV(text);
      if(!rows.length) throw new Error('Aucune action trouvée dans le fichier.');
      const data=compute(rows);
      pending={source:file.name,data};
      const j=file.name.match(/J\s*0*(\d{1,2})/i); if(j&&!$('fJournee').value) $('fJournee').value='J'+j[1];
      $('dropLabel').textContent=file.name;
      msg.className='msg ok'; msg.textContent=`${rows.length} séquences lues, ${data.players.length} joueurs. Renseigne l’adversaire puis génère le rapport.`;
      $('btnSave').disabled=false;
    }catch(err){ pending=null; $('btnSave').disabled=true; msg.className='msg err'; msg.textContent=err.message+' Vérifie que c’est bien l’export « indiv » (CSV ou XML).'; }
  };
  r.onerror=()=>{ msg.className='msg err'; msg.textContent='Impossible de lire ce fichier.'; };
  r.readAsArrayBuffer(file);
}
$('btnSave').addEventListener('click',async()=>{
  if(!pending) return;
  const m={journee:$('fJournee').value.trim(),adversaire:$('fAdv').value.trim(),date:$('fDate').value.trim(),source:pending.source,ajoute:new Date().toISOString()};
  const id=slug([m.journee,m.adversaire].filter(Boolean).join(' ')||pending.source.replace(/\.[^.]+$/,''));
  const full={...m,id,data:pending.data};
  if(DB&&canWrite){
    $('btnSave').disabled=true; $('msg').className='msg'; $('msg').textContent='Enregistrement…';
    try{ await DB.collection('matchs').doc(id).set({...m,payload:JSON.stringify(pending.data)}); }
    catch(e){ $('btnSave').disabled=false; $('msg').className='msg err';
      $('msg').textContent=e&&e.code==='quota_exceeded'?'Espace de stockage plein : supprime un ancien match puis réessaie.':e&&e.code==='invalid_argument'?'Tu n’as pas les droits pour enregistrer un match sur cette page. Le rapport s’affiche quand même ci-dessous.':'Enregistrement impossible pour le moment. Réessaie dans un instant.';
      MATCHES=MATCHES.filter(x=>x.id!==id).concat(full); show(id); return; }
  }
  MATCHES=MATCHES.filter(x=>x.id!==id).concat(full).sort((a,b)=>String(b.ajoute).localeCompare(String(a.ajoute)));
  $('importPanel').hidden=true; resetImport(); ['fJournee','fAdv','fDate'].forEach(i=>$(i).value='');
  show(id);
});
let armed=false;
function disarm(){ armed=false; $('btnDelete').classList.remove('armed'); $('btnDelete').textContent='Supprimer ce match'; }
$('btnDelete').addEventListener('click',async()=>{
  if(!current||!DB) return;
  if(!armed){ armed=true; $('btnDelete').classList.add('armed'); $('btnDelete').textContent='Confirmer la suppression'; setTimeout(disarm,4000); return; }
  const id=current; disarm();
  try{ await DB.collection('matchs').doc(id).delete(); MATCHES=MATCHES.filter(x=>x.id!==id); show(MATCHES[0]?.id||null); }
  catch(e){ $('msg').textContent='Suppression impossible.'; }
});

/* ===== Export PDF de la vue affichée ===== */
let DL=null;
function loadScript(src){return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Chargement impossible : '+src)); document.head.appendChild(s); });}
async function libs(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
function exportName(){
  const clean=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
  if(current===SEASON_ID) return 'Stats_indiv_Saison_2026-2027.pdf';
  if(current===COMPARE_ID) return `Comparaison_${clean(CMP.a)}_vs_${clean(CMP.b)}${CMP.scope==='saison'?'':'_'+clean(label(MATCHES.find(m=>m.id===CMP.scope)||{}))}.pdf`;
  const m=MATCHES.find(x=>x.id===current); return m?`Stats_indiv_${clean(m.journee||'')}_vs_${clean(m.adversaire||'')}.pdf`:'Stats_indiv.pdf';
}
function fixSvgColors(root){
  root.querySelectorAll('svg *').forEach(n=>{
    const cs=getComputedStyle(n);
    for(const at of ['fill','stroke']){ const a=n.getAttribute(at); if((a&&a.includes('var('))||(n.tagName==='text'&&at==='fill')) n.setAttribute(at, cs[at]); }
  });
}
async function exportPDF(){
  const btn=$('btnExport'), msg=$('exportMsg');
  const ov=document.createElement('div'); ov.className='export-ov'; ov.innerHTML='<div><b>Préparation du PDF…</b><span>Quelques secondes</span></div>'; document.body.appendChild(ov);
  const root=document.documentElement, prevTheme=root.getAttribute('data-theme'); const sx=window.scrollX, sy0=window.scrollY;
  btn.disabled=true; msg.textContent='';
  try{
    await libs();
    root.setAttribute('data-theme','light'); root.classList.add('exporting');
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    window.scrollTo(0,0);
    const rep=$('report'); fixSvgColors(rep);
    const bg=getComputedStyle(document.body).backgroundColor;
    const mast=rep.querySelector('header.mast'), main=rep.querySelector('main'), foot=rep.querySelector('footer');
    const units=[]; if(mast) units.push({el:mast,kids:[mast]});
    if(main) [...main.children].forEach((sec,si)=>units.push({el:sec,kids:[...sec.children],newPage:si>0}));
    else [...rep.children].filter(c=>c!==mast&&c!==foot&&!c.classList.contains('no-print')&&c.tagName!=='NAV').forEach(c=>units.push({el:c,kids:[c]}));
    if(foot) units.push({el:foot,kids:[foot]});
    const { jsPDF }=window.jspdf; const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const M=10, PW=210-2*M, PH=297-2*M, W=1100, k=PW/W, GAP=12*k, SC=2;
    let bgRGB=[243,243,241]; try{ bgRGB=bg.match(/\d+/g).slice(0,3).map(Number); }catch(e){}
    const paintBg=()=>{ pdf.setFillColor(bgRGB[0],bgRGB[1],bgRGB[2]); pdf.rect(0,0,210,297,'F'); };
    let y=M, first=true; paintBg();
    for(const [ui,u] of units.entries()){
      u.el.setAttribute('data-expu',ui); u.kids.forEach((ch,ci)=>ch.setAttribute('data-expk',ci));
      let geo=[];
      const canvas=await html2canvas(u.el,{scale:SC,backgroundColor:bg,logging:false,windowWidth:W+40,windowHeight:Math.max(2000,document.documentElement.scrollHeight),scrollX:0,scrollY:-window.scrollY,
        onclone:doc=>{ const ue=doc.querySelector(`[data-expu="${ui}"]`); const t0=ue.getBoundingClientRect().top;
          geo=[...ue.querySelectorAll('[data-expk]')].filter(n=>n===ue||n.parentElement===ue||n.hasAttribute('data-expk')).map(n=>{const r=n.getBoundingClientRect(); return {k:+n.getAttribute('data-expk'),top:r.top-t0,h:r.height};});
          if(u.kids.length===1&&u.kids[0]===u.el) geo=[{k:0,top:0,h:ue.getBoundingClientRect().height}]; }});
      geo.sort((p,q)=>p.k-q.k);
      geo.forEach(g=>{
        const sy=Math.max(0,g.top*SC), sh=Math.min(canvas.height-sy,g.h*SC);
        if(sh<=0) return;
        const c=document.createElement('canvas'); c.width=canvas.width; c.height=Math.round(sh);
        c.getContext('2d').drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
        let w=(canvas.width/SC)*k, hgt=(sh/SC)*k; if(hgt>PH){ const s=PH/hgt; w*=s; hgt=PH; }
        if(!first && ((g.k===0&&u.newPage) || y+hgt>M+PH)){ pdf.addPage(); paintBg(); y=M; }
        pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',M,y,w,hgt,undefined,'FAST');
        y+=hgt+GAP; first=false;
      });
      u.el.removeAttribute('data-expu'); u.kids.forEach(ch=>ch.removeAttribute('data-expk'));
    }
    const blob=pdf.output('blob');
    if(window.__EXPORT_HOOK){ await window.__EXPORT_HOOK(blob, exportName()); }
    else { await DL.save({filename:exportName(), data:blob}); msg.textContent='PDF prêt.'; }
  }catch(e){
    msg.textContent = e&&e.code==='declined'?'Export annulé.':e&&e.code==='rate_limited'?'Un enregistrement est déjà en cours, réessaie dans un instant.':'Export impossible : '+(e&&e.message||'erreur inconnue')+'.';
  }finally{
    root.classList.remove('exporting'); if(prevTheme==null) root.removeAttribute('data-theme'); else root.setAttribute('data-theme',prevTheme);
    ov.remove(); btn.disabled=false;
    show(current); try{ window.scrollTo(sx,sy0); }catch(e){} // redessine la vue proprement
  }
}
$('btnExport').addEventListener('click',exportPDF);
(async()=>{ if(window.__EXPORT_HOOK){ $('btnExport').hidden=false; return; } if(!window.claude?.use) return; const [dl,u]=await Promise.all([claude.use('downloads'),claude.use('user')]); const own=u?await u.isOwner():false; if(dl&&own){ DL=dl; $('btnExport').hidden=false; } })();

/* ===== Démarrage ===== */
renderReport(null); fillSelect();
(async()=>{
  if(!window.claude?.use) return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db) return;
  DB=db;
  if(user){ const [own,ed,c]=await Promise.all([user.isOwner(),user.canEdit(),user.can('data.write')]); OWNER=own; if(!(own||ed)||c===false){ canWrite=false; $('btnImport').hidden=true; $('importPanel').hidden=true; } } else { canWrite=false; $('btnImport').hidden=true; }
  let saved=null; try{ saved=localStorage.getItem('match'); }catch(e){}
  db.doc('effectif/saison').onSnapshot(s=>{ const d=s.exists?s.data():null; setRoster(d&&d.joueurs||[]); if(current) show(current); },()=>{});
  db.doc('temps/pro').onSnapshot(s=>{ const d=s.exists?s.data():null; PRO={joueurs:[...((d&&d.joueurs)||[])],minutes:JSON.parse(JSON.stringify((d&&d.minutes)||{}))};
    if(current===MIN_ID && !(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.mtab'))) renderMinutes(); },()=>{});
  db.doc('temps/saison').onSnapshot(s=>{ const d=s.exists?s.data():null; MIN=JSON.parse(JSON.stringify((d&&d.minutes)||{})); MIN_LOADED=true;
    if(current===MIN_ID && !(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.mtab'))) renderMinutes();
    if(current===SEASON_ID) renderSeason(); },()=>{});
  db.collection('logos').onSnapshot(snap=>{
    snap.docs.forEach(d=>{const x=d.data(); if(x&&x.dataUrl) LOGOS[d.id]=x.dataUrl;});
    if(current===SEASON_ID) renderSeason(); else if(current===COMPARE_ID) renderCompare(); else if(current===MIN_ID) renderMinutes(); else if(window.__report) renderReport(window.__report);
  },()=>{});
  db.collection('matchs').onSnapshot(snap=>{
    MATCHES=snap.docs.map(docToMatch).filter(Boolean).sort((a,b)=>String(b.ajoute).localeCompare(String(a.ajoute)));
    const okId=id=>(id===SEASON_ID||id===COMPARE_ID||id===MIN_ID)?MATCHES.length>0:!!MATCHES.find(x=>x.id===id);
    const keep=okId(current)?current:(okId(saved)?saved:([...MATCHES].sort((a,b)=>jnum(b)-jnum(a))[0]?.id||null));
    if(keep===SEASON_ID||keep===COMPARE_ID||keep===MIN_ID){ current=keep; fillSelect(); keep===SEASON_ID?renderSeason():keep===COMPARE_ID?renderCompare():renderMinutes(); return; }
    const cur=MATCHES.find(x=>x.id===keep);
    if(keep!==current || !document.querySelector('#report main') || (cur&&cur.ajoute!==window.__report?.ajoute)) show(keep); else fillSelect();
  },()=>{});
})();
